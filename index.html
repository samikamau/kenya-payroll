<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kenya Payroll Register</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#0B1626;
    --panel:#12213A;
    --panel-2:#16294A;
    --gold:#B08D57;
    --red:#A5382B;
    --cream:#EFE7D6;
    --ink:#EAF0F7;
    --line:#233757;
    --muted:#8FA3C4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:500;margin:0;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .app{display:flex;min-height:100vh;}

  /* Rail */
  .rail{
    width:230px;flex-shrink:0;background:var(--panel);
    border-right:1px solid var(--line);padding:22px 16px;
  }
  .rail-title{font-size:13px;letter-spacing:.02em;color:var(--gold);font-family:'JetBrains Mono',monospace;margin-bottom:2px;}
  .rail-sub{font-size:11px;color:var(--muted);margin-bottom:20px;}
  .client-item{
    padding:9px 10px;border-radius:4px;font-size:13.5px;cursor:pointer;
    color:var(--muted);margin-bottom:2px;border:1px solid transparent;
    display:flex;justify-content:space-between;align-items:center;gap:6px;
  }
  .client-item.active{background:var(--panel-2);color:var(--ink);border-color:var(--line);}
  .client-item:hover{color:var(--ink);}
  .client-item .del{opacity:0;font-size:11px;color:var(--red);}
  .client-item:hover .del{opacity:.7;}
  .client-item .del:hover{opacity:1;}
  .add-client{
    width:100%;margin-top:10px;padding:8px 10px;background:none;
    border:1px dashed var(--line);color:var(--muted);border-radius:4px;
    font-family:'Inter',sans-serif;font-size:12.5px;cursor:pointer;
  }
  .add-client:hover{color:var(--gold);border-color:var(--gold);}
  .rail-footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);}
  .rail-btn{
    width:100%;text-align:left;background:none;border:none;color:var(--muted);
    font-family:'Inter',sans-serif;font-size:12px;padding:6px 2px;cursor:pointer;
  }
  .rail-btn:hover{color:var(--ink);}

  /* Main */
  .main{flex:1;padding:28px 34px 60px;max-width:1180px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
  .company-name-input{
    background:none;border:none;color:var(--ink);font-family:'Fraunces',serif;
    font-size:26px;font-weight:500;padding:0;outline:none;min-width:220px;
  }
  .company-name-input::placeholder{color:var(--muted);}
  .period-row{display:flex;gap:10px;align-items:center;}
  .period-row input{
    background:var(--panel);border:1px solid var(--line);color:var(--ink);
    border-radius:4px;padding:6px 10px;font-family:'JetBrains Mono',monospace;font-size:12.5px;
  }

  /* Summary cards */
  .summary{display:grid;grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));gap:12px;margin-bottom:26px;}
  .composition-wrap{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-bottom:26px;}
  .composition-bar{display:flex;width:100%;height:28px;border-radius:5px;overflow:hidden;margin:14px 0;}
  .composition-legend{display:grid;grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));gap:8px 16px;}
  .composition-legend-item{display:flex;align-items:center;gap:8px;font-size:12px;}
  .composition-swatch{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
  .scroll-fab{
    position:fixed;bottom:26px;right:26px;width:46px;height:46px;border-radius:50%;
    background:var(--gold);color:var(--bg);border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.4);z-index:20;transition:opacity .15s ease, transform .15s ease;
  }
  .scroll-fab:hover{transform:translateY(-2px);}
  .scroll-fab.hidden{opacity:0;pointer-events:none;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;}
  .card .label{font-size:11px;color:var(--muted);text-transform:none;margin-bottom:6px;}
  .card .value{font-family:'JetBrains Mono',monospace;font-size:19px;color:var(--ink);}
  .card.accent .value{color:var(--gold);}
  .card.deduct .value{color:#C77B6E;}

  /* Table */
  .table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:20px;}
  .table-wrap.scroll-table{overflow:auto;max-height:480px;}
  .table-wrap.scroll-table table{table-layout:fixed;}
  .table-wrap.scroll-table thead th{position:sticky;top:0;background:var(--panel-2);z-index:2;}
  .table-wrap.scroll-table th{position:relative;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .col-resize-handle{
    position:absolute;top:0;right:0;width:6px;height:100%;cursor:col-resize;
    background:transparent;z-index:3;
  }
  .col-resize-handle:hover, .col-resize-handle.resizing{background:var(--gold);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;padding:10px 12px;color:var(--muted);font-weight:500;
    font-size:11px;border-bottom:1px solid var(--line);background:var(--panel-2);white-space:nowrap;
  }
  tbody td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:rgba(176,141,87,0.05);cursor:pointer;}
  td input{
    width:100%;background:none;border:none;color:var(--ink);font-family:'JetBrains Mono',monospace;
    font-size:13px;padding:2px 0;outline:none;border-bottom:1px solid transparent;
  }
  td input:focus{border-bottom:1px solid var(--gold);}
  td.name-cell input{font-family:'Inter',sans-serif;font-size:13.5px;}
  td.num{font-family:'JetBrains Mono',monospace;text-align:right;}
  td.num.net{color:var(--gold);font-weight:600;}
  .row-del{color:var(--muted);opacity:0;cursor:pointer;font-size:14px;padding:0 4px;}
  tr:hover .row-del{opacity:.6;}
  .row-del:hover{opacity:1;color:var(--red);}
  .add-row-btn{
    display:block;width:100%;text-align:left;padding:10px 12px;background:none;
    border:none;color:var(--muted);font-family:'Inter',sans-serif;font-size:12.5px;cursor:pointer;
  }
  .add-row-btn:hover{color:var(--gold);}

  .actions{display:flex;gap:10px;margin-bottom:30px;}
  .btn{
    padding:8px 14px;border-radius:4px;font-family:'Inter',sans-serif;font-size:12.5px;
    cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  }
  .btn:hover{border-color:var(--gold);color:var(--gold);}
  .btn.primary{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:600;}
  .btn.primary:hover{opacity:.9;color:var(--bg);}

  /* Drawer */
  .drawer-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:10;
  }
  .drawer-backdrop.open{display:block;}
  .drawer{
    position:fixed;top:0;right:0;height:100%;width:380px;max-width:92vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:11;
    padding:26px 26px 30px;transform:translateX(100%);transition:transform .25s ease;
    overflow-y:auto;
  }
  .drawer.open{transform:translateX(0);}
  .drawer h2{font-size:22px;margin-bottom:2px;}
  .drawer .role{color:var(--muted);font-size:12.5px;margin-bottom:20px;}
  .payslip-section{margin-bottom:18px;}
  .payslip-section h3{font-size:11px;text-transform:none;color:var(--gold);font-family:'Inter',sans-serif;font-weight:600;margin-bottom:8px;letter-spacing:.02em;}
  .payslip-line{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px solid var(--line);}
  .payslip-line span:last-child{font-family:'JetBrains Mono',monospace;}
  .payslip-line.total{font-weight:600;border-bottom:none;padding-top:8px;}
  .payslip-line.net span:last-child{color:var(--gold);font-size:16px;}
  .close-drawer{position:absolute;top:22px;right:22px;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;}
  .close-drawer:hover{color:var(--ink);}

  /* Settings panel */
  .settings-panel{
    background:var(--panel);border:1px solid var(--line);border-radius:6px;
    padding:18px 20px;margin-bottom:24px;
  }
  .settings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-top:12px;}
  .settings-field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;}
  .settings-field input{
    width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);
    border-radius:4px;padding:6px 8px;font-family:'JetBrains Mono',monospace;font-size:12.5px;
  }
  .settings-note{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.5;}
  .empty-state{padding:60px 20px;text-align:center;color:var(--muted);}
  .empty-state h2{color:var(--ink);margin-bottom:8px;}

  /* Auth screen */
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .auth-box{width:340px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:32px;}
  .auth-box h1{font-size:22px;margin-bottom:4px;}
  .auth-box .sub{color:var(--muted);font-size:12.5px;margin-bottom:22px;}
  .auth-field{margin-bottom:14px;}
  .auth-field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;}
  .auth-field input{
    width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);
    border-radius:4px;padding:9px 10px;font-family:'Inter',sans-serif;font-size:13.5px;
  }
  .auth-error{color:#C77B6E;font-size:12.5px;margin-bottom:12px;min-height:16px;}
  .auth-toggle{margin-top:16px;font-size:12.5px;color:var(--muted);text-align:center;}
  .auth-toggle a{color:var(--gold);cursor:pointer;text-decoration:none;}
  .user-badge{font-size:11.5px;color:var(--muted);padding:6px 2px;border-top:1px solid var(--line);margin-top:6px;padding-top:12px;word-break:break-all;}
</style>

// When unchecked, it's kept only for the current browser session (sessionStorage) — closing the
// browser signs the person out. getItem checks both so an existing session is found either way;
// setItem decides where a NEW session gets written based on the checkbox at the moment of sign-in.
let rememberMeChoice = true;
const rememberAwareStorage = {
  getItem: (key) => window.localStorage.getItem(key) ?? window.sessionStorage.getItem(key),
  setItem: (key, value) => {
    if(rememberMeChoice){
      window.localStorage.setItem(key, value);
      window.sessionStorage.removeItem(key);
    } else {
      window.sessionStorage.setItem(key, value);
      window.localStorage.removeItem(key);
    }
  },
  removeItem: (key) => {
    window.localStorage.removeItem(key);
    window.sessionStorage.removeItem(key);
  }
};

let _resizeState = null;
function startColResize(evt, key){
  evt.preventDefault();
  const th = evt.target.closest('th');
  _resizeState = { key, startX: evt.clientX, startWidth: th.offsetWidth };
  evt.target.classList.add('resizing');
  document.addEventListener('mousemove', handleColResize);
  document.addEventListener('mouseup', stopColResize);
}
function handleColResize(evt){
  if(!_resizeState) return;
  const delta = evt.clientX - _resizeState.startX;
  const newWidth = Math.max(45, _resizeState.startWidth + delta);
  const colEl = document.getElementById('col-' + _resizeState.key);
  if(colEl) colEl.style.width = newWidth + 'px';
}
function stopColResize(){
  if(!_resizeState) return;
  const colEl = document.getElementById('col-' + _resizeState.key);
  if(colEl){
    employeeColWidths[_resizeState.key] = parseInt(colEl.style.width);
    localStorage.setItem('employeeColWidths', JSON.stringify(employeeColWidths));
  }
  document.querySelectorAll('.col-resize-handle.resizing').forEach(el => el.classList.remove('resizing'));
  document.removeEventListener('mousemove', handleColResize);
  document.removeEventListener('mouseup', stopColResize);
  _resizeState = null;
}

function esc(str){
  // Escapes text before it's interpolated into HTML attributes or content — prevents a
  // client/employee name containing a stray quote or angle bracket from breaking out of
  // an attribute and injecting arbitrary HTML/JS (stored XSS).
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function hexToRgb(hex){
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec((hex||'').trim());
  if(!m) return [176,141,87]; // fallback gold
  return [parseInt(m[1],16), parseInt(m[2],16), parseInt(m[3],16)];
}

const BONUS_TYPES = ['Bonus','Commission','Arrears','One-off Payment','Other'];
function isRecurring(item){ return item.recurring !== false; } // undefined/true = recurring (matches existing pre-flag data unchanged)

function sumDeductions(items){
  return (items||[]).reduce((s,d) => s + (parseFloat(d.amount)||0), 0);
}

function splitName(fullName){
  const parts = (fullName||'').trim().split(/\s+/).filter(Boolean);
  if(parts.length === 0) return { surname:'', otherNames:'' };
  if(parts.length === 1) return { surname: parts[0], otherNames:'' };
  return { surname: parts[parts.length-1], otherNames: parts.slice(0,-1).join(' ') };
}

function calcPAYE(taxable){
  let remaining = taxable, tax = 0, lower = 0;
  for(const b of RATES.bands){
    const bandAmount = Math.max(0, Math.min(remaining, b.upTo - lower));
    tax += bandAmount * b.rate;
    remaining -= bandAmount;
    lower = b.upTo;
    if(remaining <= 0) break;
  }
  return tax;
}

function sumBonuses(items){
  return (items||[]).reduce((s,d) => s + (parseFloat(d.amount)||0), 0);
}
function calcEmployee(e){
  const basic = Number(e.basic)||0;
  const allowances = Number(e.allowances)||0;
  const overtimePay = Number(e.overtimePay)||0;
  const bonusPay = sumBonuses(e.bonusItems);
  const gross = basic + allowances + overtimePay + bonusPay; // one-off bonuses are taxable cash pay, like overtime, but NOT part of the NSSF pensionable base (basic only, below)

  const tier1 = Math.min(basic, RATES.nssfLEL) * RATES.nssfRate;
  const tier2 = Math.max(0, Math.min(basic, RATES.nssfUEL) - RATES.nssfLEL) * RATES.nssfRate;
  const nssfEmployee = tier1 + tier2;
  const nssfEmployer = nssfEmployee;

  const shif = gross > 0 ? Math.max(gross * RATES.shifRate, RATES.shifMin) : 0;
  const ahlEmployee = gross * RATES.ahlRate;
  const ahlEmployer = gross * RATES.ahlRate;

  const voluntaryPension = Math.min(Number(e.pension)||0, Math.max(0, RATES.pensionReliefCap - nssfEmployee));

  const taxable = Math.max(0, gross - nssfEmployee - shif - ahlEmployee - voluntaryPension);
  const grossTax = calcPAYE(taxable);
  const insuranceRelief = Math.min((Number(e.insurance)||0) * RATES.insuranceReliefRate, RATES.insuranceReliefCap);
  const paye = Math.max(0, grossTax - RATES.personalRelief - insuranceRelief);

  const otherDeduct = sumDeductions(e.deductionItems);
  const totalDeductions = nssfEmployee + shif + ahlEmployee + voluntaryPension + paye + otherDeduct;
  const net = gross - totalDeductions;

  const nita = gross > 0 ? RATES.nitaLevy : 0;
  const employerCost = gross + nssfEmployer + ahlEmployer + nita;

  return { gross, overtimePay, bonusPay, nssfEmployee, nssfEmployer, shif, ahlEmployee, ahlEmployer,
           voluntaryPension, taxable, grossTax, insuranceRelief, paye,
           otherDeduct, totalDeductions, net, nita, employerCost };
}

async function handleLogoUpload(event){
  const file = event.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ alert('Please choose an image file.'); return; }

  const dataUrl = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });

  // Resize down to a sane max width so we're not storing multi-MB phone photos in the database.
  // Aspect ratio is captured here and stored separately, so the PDF render never distorts the logo
  // regardless of what size the user picks later.
  const { resized, aspect } = await new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 320;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve({ resized: canvas.toDataURL('image/png'), aspect: img.height / img.width });
    };
    img.src = dataUrl;
  });

  const c = state.clients[state.activeClient];
  c.logoDataUrl = resized; c.logoAspect = aspect;
  await sb.from('companies').update({ logo_data_url: resized, logo_aspect: aspect }).eq('id', state.activeClient);
  render();
}

let _pendingDeleteCode = null;
let _pendingDeleteExpiry = 0;

async function deleteClient(id, ev){
  if(ev) ev.stopPropagation();
  const client = state.clients[id];
  if(!client) return;

  const clientName = client.name || 'this client';
  if(!confirm(`Delete "${clientName}" and all its payroll data? This cannot be undone.`)) return;

  const { data: userData } = await sb.auth.getUser();
  const email = userData?.user?.email;
  if(!email){ alert('Could not confirm your account email. Please sign in again and retry.'); return; }

  const code = String(Math.floor(100000 + Math.random() * 900000));
  _pendingDeleteCode = code;
  _pendingDeleteExpiry = Date.now() + 10 * 60 * 1000; // 10 minutes

  try{
    const { error } = await sb.functions.invoke('send-verification-code', {
      body: { to: email, code, purpose: `deleting the client "${clientName}"` }
    });
    if(error) throw error;
  } catch(err){
    let detail = err.message || 'the verification email function may not be set up yet.';
    try{
      if(err.context && typeof err.context.json === 'function'){
        const body = await err.context.json();
        if(body && body.error) detail = body.error;
      }
    }catch(_){ /* fall back to the generic message above if the body can't be read */ }
    alert('Could not send a verification code: ' + detail);
    return;
  }

  const entered = prompt(`For your security, a 6-digit verification code was just sent to ${email}.\n\nEnter it below to permanently delete "${clientName}":`);
  if(entered === null) return; // user cancelled — nothing deleted
  if(Date.now() > _pendingDeleteExpiry){
    alert('That code has expired. Click delete again to get a new one.');
    return;
  }
  if(entered.trim() !== _pendingDeleteCode){
    alert('Incorrect code. The client was not deleted.');
    return;
  }
  _pendingDeleteCode = null;

  const { error } = await sb.from('companies').delete().eq('id', id);
  if(error){ alert(error.message); return; }
  delete state.clients[id];
  const names = Object.keys(state.clients);
  if(names.length === 0){
    await addClient();
  } else if(state.activeClient === id){
    state.activeClient = names[0];
  }
  render();
}

/* ---------------- Payroll period locking ----------------
   Once a period is Closed, it becomes permanently read-only — enforced first here for a clean
   UX (the person gets a clear message instead of a silent failed save), and enforced again,
   unconditionally, at the database level via RLS (migration_010) so the lock holds even if
   someone bypasses the app entirely and talks to Supabase directly.
------------------------------------------------------------------------------------------- */
function getPeriodRecord(c, period){
  return (c.payrollPeriods||[]).find(pp => pp.period === period);
}
function isPeriodClosed(c, period){
  const p = getPeriodRecord(c, period);
  return !!(p && p.status === 'Closed');
}
function isPeriodLocked(c, period){
  // Both 'Processed' and 'Closed' block direct editing. The difference: Processed can be
  // reopened (an explicit, logged action); Closed cannot, ever, per the two documents'
  // resolved rule — this is the only place that distinction is decided.
  const p = getPeriodRecord(c, period);
  return !!(p && (p.status === 'Processed' || p.status === 'Closed'));
}
function blockIfClosed(c){
  const p = getPeriodRecord(c, c.period);
  if(p && p.status === 'Closed'){
    alert(`${c.period} is closed and permanently locked. Switch to a different (open) pay period to make changes — closed periods cannot be amended, by anyone, through any part of this app.`);
    return true;
  }
  if(p && p.status === 'Processed'){
    alert(`${c.period} has been processed and is locked for editing. Click "Reopen payroll" below to amend it before re-processing, or switch to a different period.`);
    return true;
  }
  return false;
}

async function reopenPeriod(){
  const c = state.clients[state.activeClient];
  const record = getPeriodRecord(c, c.period);
  if(!record || record.status !== 'Processed'){
    alert('Only a Processed (not yet closed) period can be reopened.');
    return;
  }
  if(!confirm(`Reopen ${c.period} for editing? This is logged. You'll need to process it again once you're done amending it.`)) return;
  const { error } = await sb.from('payroll_periods').update({ status: 'Reopened' }).eq('id', record.id);
  if(error){ alert('Could not reopen: ' + error.message); return; }
  record.status = 'Reopened';
  logAudit('Payroll period reopened', `${c.period} — reopened for amendment`);
  render();
}

/* ---------------- Free trial gating ----------------
   Each client gets one free payroll cycle (one pay period). The first time any
   payslip/export action is used for a client, that period is locked in as their
   trial period. Trying to run a DIFFERENT period afterward is blocked until the
   client is marked as paid. This is a manual gate for now — no automated billing
   is wired up yet, so "mark as paid" is a judgment call you make after collecting
   payment outside the app (M-Pesa, bank transfer, etc.).
------------------------------------------------------------------------------ */
function requireAccess(c){
  if(c.isPaid) return true;
  const currentPeriod = c.period || '(no period set)';
  if(!c.trialPeriodUsed){
    c.trialPeriodUsed = currentPeriod;
    sb.from('companies').update({ trial_period_used: currentPeriod }).eq('id', state.activeClient);
    return true;
  }
  if(c.trialPeriodUsed === currentPeriod) return true;
  alert(`This client's free payroll cycle (${c.trialPeriodUsed}) has already been used.\n\nTo run payroll for ${currentPeriod}, mark this client as paid first (button next to their name).`);
  return false;
}
async function markClientPaid(){
  const c = state.clients[state.activeClient];
  if(!c) return;
  if(!confirm(`Mark "${c.name || 'this client'}" as paid? This unlocks unlimited payroll cycles for them.`)) return;
  c.isPaid = true;
  await sb.from('companies').update({ is_paid: true }).eq('id', state.activeClient);
  logAudit('Client marked as paid', c.name || '');
  render();
}
async function markClientUnpaid(){
  const c = state.clients[state.activeClient];
  if(!c) return;
  if(!confirm(`Move "${c.name || 'this client'}" back to trial status? They'll be restricted again once their trial period is used.`)) return;
  c.isPaid = false;
  await sb.from('companies').update({ is_paid: false }).eq('id', state.activeClient);
  logAudit('Client moved back to trial', c.name || '');
  render();
}

function generatePayslipPDF(empId){
  const c = state.clients[state.activeClient];
  const emp = c.employees.find(e => e.id === empId);
  const r = calcEmployee(emp);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format: [297.64, 841.89] }); // A4 height kept as-is; width halved, per instruction
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const left = 32; const right = pageWidth - 32; let y = 40;
  const [br, bg, bb] = hexToRgb(c.brandColor || '#B08D57');

  const line = (label, value, opts={}) => {
    doc.setFont('helvetica', opts.bold ? 'bold' : 'normal');
    doc.setFontSize(opts.size || 9.5);
    doc.text(label, left, y);
    doc.text(String(value), right, y, { align:'right' });
    y += opts.gap || 14;
  };
  const section = (title) => {
    y += 5;
    doc.setDrawColor(180); doc.line(left, y, right, y); y += 15;
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.setTextColor(br, bg, bb);
    doc.text(title.toUpperCase(), left, y);
    doc.setTextColor(20,20,20);
    y += 15;
  };
  const centerX = pageWidth / 2;

  // Header block: logo, company name, "PAYSLIP" title, pay period — all centered.
  y += 6;
  if(c.logoDataUrl){
    try{
      const logoW = Math.min(c.logoSize || 60, 70);
      const logoH = logoW * (c.logoAspect || 0.75);
      doc.addImage(c.logoDataUrl, 'PNG', centerX - logoW / 2, y, logoW, logoH);
      y += logoH + 10;
    }catch(e){ /* ignore malformed image, don't block payslip generation */ }
  }

  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.setTextColor(br, bg, bb);
  doc.text(c.name || 'Payslip', centerX, y, { align:'center' });
  y += 17;

  doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.setTextColor(20,20,20);
  doc.text('PAYSLIP', centerX, y, { align:'center' });
  y += 13;

  doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  doc.setTextColor(90,90,90);
  doc.text(`Pay Period: ${c.period || '-'}`, centerX, y, { align:'center' });
  doc.setTextColor(20,20,20);
  y += 16;

  // Bold rule, then a dotted rule beneath it, closing out the header block.
  doc.setLineWidth(1.4); doc.setDrawColor(20,20,20);
  doc.line(left, y, right, y);
  y += 5;
  doc.setLineWidth(0.75); doc.setLineDashPattern([1.5, 1.5], 0);
  doc.line(left, y, right, y);
  doc.setLineDashPattern([], 0); doc.setLineWidth(1);
  y += 16;

  // Remaining identifying fields, left-aligned as before.
  line('Employer PIN', c.kraPin || '-');
  line('Employee Name', emp.name || 'Unnamed');
  line('Payroll Number', emp.payrollNumber || '-');
  line('KRA PIN', emp.pin || '-');
  y += 4;

  section('Earnings');
  line('Basic salary', fmt(emp.basic));
  line('Allowances', fmt(emp.allowances));
  if(emp.overtimePay) line('Overtime pay', fmt(emp.overtimePay));
  (emp.bonusItems||[]).forEach(b => {
    if(b.amount) line(b.description ? `${b.type}: ${b.description}` : b.type, fmt(b.amount));
  });
  line('Gross pay', fmt(r.gross), { bold:true });

  section('Statutory deductions');
  line('NSSF (Tier I + II)', fmt(r.nssfEmployee));
  line('SHIF (2.75%)', fmt(r.shif));
  line('Housing Levy (1.5%)', fmt(r.ahlEmployee));
  if(r.voluntaryPension) line('Voluntary pension', fmt(r.voluntaryPension));
  y += 4;
  line('Taxable pay', fmt(r.taxable));
  line('Tax on taxable pay', fmt(r.grossTax));
  line('Less: personal relief', `-${fmt(RATES.personalRelief)}`);
  if(r.insuranceRelief) line('Less: insurance relief', `-${fmt(r.insuranceRelief)}`);
  line('PAYE', fmt(r.paye), { bold:true });

  const hasOtherDeductions = (emp.deductionItems||[]).some(d => d.amount);
  if(hasOtherDeductions){
    section('Other deductions');
    (emp.deductionItems||[]).forEach(d => {
      if(d.amount) line(d.description ? `${d.type}: ${d.description}` : d.type, fmt(d.amount));
    });
    line('Total other deductions', fmt(r.otherDeduct), { bold:true });
  }

  section('Net pay');
  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.setTextColor(br, bg, bb);
  doc.text('Take-home pay', left, y);
  doc.text(`KES ${fmt(r.net)}`, right, y, { align:'right' });
  doc.setTextColor(20,20,20);
  y += 26;

  doc.setFont('helvetica','italic'); doc.setFontSize(7.5); doc.setTextColor(140,140,140);
  doc.text('Generated by Finlens Africa. Verify statutory figures against current KRA/NSSF/SHA rates.', left, pageHeight - 24, { maxWidth: pageWidth - left * 2 });

  return { doc, filename: `${(emp.name||'employee').replace(/\s+/g,'_')}_payslip_${c.period||''}.pdf` };
}

function downloadPayslipPDF(empId){
  const c = state.clients[state.activeClient];
  if(!requireAccess(c)) return;
  const { doc, filename } = generatePayslipPDF(empId);
  doc.save(filename);
}

async function emailPayslip(empId, evt){
  const c = state.clients[state.activeClient];
  if(!requireAccess(c)) return;
  const emp = c.employees.find(e => e.id === empId);
  if(!emp.email){
    const addr = prompt('Enter this employee\'s email address:');
    if(!addr) return;
    await updateEmployeeField(empId, 'email', addr);
    emp.email = addr;
  }
  const { doc } = generatePayslipPDF(empId);
  const pdfBase64 = doc.output('datauristring').split(',')[1];
  const btn = evt.target;
  const originalText = btn.textContent;
  btn.textContent = 'Sending...'; btn.disabled = true;
  try{
    const { data, error } = await sb.functions.invoke('send-payslip', {
      body: {
        to: emp.email,
        employeeName: emp.name,
        companyName: c.name,
        period: c.period,
        pdfBase64
      }
    });
    if(error) throw error;
    alert(`Payslip sent to ${emp.email}`);
  } catch(err){
    let detail = err.message || 'the email function may not be set up yet.';
    try{
      if(err.context && typeof err.context.json === 'function'){
        const body = await err.context.json();
        if(body && body.error) detail = body.error;
      }
    }catch(_){}
    alert('Could not send email: ' + detail);
  } finally {
    btn.textContent = originalText; btn.disabled = false;
  }
}

function downloadCSV(rows, filename){
  const csv = rows.map(row => row.map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

const IMPORT_HEADERS = [
  'Payroll Number','National ID','Name','Phone','Email','KRA PIN','NSSF Number','SHA Number','Basic Salary',
  'Allowances','Overtime Pay','Pension','Insurance Premium','Other Deductions',
  'Residential Status','Employee Type','Disability','Exemption Certificate No',
  'Identity Type','Benefit Description','Benefit Amount','Department','Employment Status'
];
const IMPORT_FIELD_MAP = {
  'name':'name', 'kra pin':'pin', 'national id':'idNumber', 'nssf number':'nssfNo', 'sha number':'shaNo',
  'payroll number':'payrollNumber', 'phone':'phone', 'email':'email', 'basic salary':'basic', 'allowances':'allowances',

  'exemption certificate no':'exemptionCertNo', 'identity type':'identityType',
  'benefit description':'benefitDescription', 'benefit amount':'benefitAmount',
  'department':'department', 'employment status':'employmentStatus'
};
const IMPORT_NUMERIC_FIELDS = ['basic','allowances','overtimePay','pension','insurance','otherDeduct','benefitAmount'];

function parseCSVText(text){
  // Minimal RFC-4180 style parser: handles quoted fields, escaped quotes, commas inside quotes.
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i], next = text[i+1];
    if(inQuotes){
      if(ch === '"' && next === '"'){ field += '"'; i++; }
      else if(ch === '"'){ inQuotes = false; }
      else field += ch;
    } else {
      if(ch === '"') inQuotes = true;
      else if(ch === ','){ row.push(field); field = ''; }
      else if(ch === '\r'){ /* skip */ }
      else if(ch === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else field += ch;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}

async function handleCSVImport(event){
  const file = event.target.files[0];
  if(!file) return;
  const text = await file.text();
  const rows = parseCSVText(text);
  if(rows.length < 2){ alert('That file has no data rows to import.'); event.target.value = ''; return; }

  const headerRow = rows[0].map((h, i) => (i === 0 ? h.replace(/^\uFEFF/, '') : h).trim().toLowerCase());
  const dataRows = rows.slice(1);

  const newEmployees = dataRows.map(cells => {
    const emp = {
      name:'', pin:'', idNumber:'', nssfNo:'', shaNo:'', payrollNumber:'', phone:'', email:'',
      basic:0, allowances:0, overtimePay:0, pension:0, insurance:0, otherDeduct:0,
      residentialStatus:'Resident', employeeType:'Primary Employee', disability:'No',
      exemptionCertNo:'', identityType:'National ID', benefitDescription:'Benefit not given', benefitAmount:0,
      department:'', employmentStatus:'Active'
    };
    headerRow.forEach((h, i) => {
      const field = IMPORT_FIELD_MAP[h];
      if(!field) return;
      let raw = (cells[i]||'').trim();
      if(raw.startsWith("'")) raw = raw.slice(1); // strip Excel's text-protection apostrophe (e.g. on NSSF/ID numbers)
      if(IMPORT_NUMERIC_FIELDS.includes(field)){
        raw = raw.replace(/,/g, ''); // strip thousand separators (e.g. "30,000.00") before parsing
        emp[field] = parseFloat(raw) || 0;
      } else {
        emp[field] = raw;
      }
    });
    // The single "Other Deductions" import column becomes one "Other" line item,
    // since deductions are now tracked as a categorized list per employee.
    emp.deductionItems = emp.otherDeduct ? [{ type:'Other', description:'Imported', amount: emp.otherDeduct }] : [];
    delete emp.otherDeduct;
    return emp;
  }).filter(e => e.name); // skip rows with no name

  if(newEmployees.length === 0){
    alert('No valid rows found. Make sure the CSV has a "Name" column with values.');
    event.target.value = '';
    return;
  }

  const companyId = state.activeClient;
  const dbRows = newEmployees.map(e => ({
    company_id: companyId, name: e.name, pin: e.pin, id_number: e.idNumber, nssf_no: e.nssfNo, sha_no: e.shaNo,
    payroll_number: e.payrollNumber, phone: e.phone, email: e.email, basic: e.basic, allowances: e.allowances, overtime_pay: e.overtimePay,
    pension: e.pension, insurance: e.insurance, deduction_items: e.deductionItems,
    residential_status: e.residentialStatus, employee_type: e.employeeType, disability: e.disability,
    exemption_cert_no: e.exemptionCertNo, identity_type: e.identityType,
    benefit_description: e.benefitDescription, benefit_amount: e.benefitAmount,
    department: e.department, employment_status: e.employmentStatus
  }));

  const { data, error } = await sb.from('employees').insert(dbRows).select();
  if(error){ alert('Import failed: ' + error.message); event.target.value = ''; return; }

  const c = state.clients[companyId];
  data.forEach((row, idx) => {
    c.employees.push({ id: row.id, ...newEmployees[idx] });
  });
  render();
  alert(`Imported ${data.length} employee${data.length===1?'':'s'}.`);
  event.target.value = '';
}

function daysBetween(startDate, endDate){
  const start = new Date(startDate), end = new Date(endDate);
  if(isNaN(start) || isNaN(end) || end < start) return 0;
  return Math.round((end - start) / 86400000) + 1; // inclusive of both start and end dates
}

function leaveSummaryForEmployee(c, empId){
  const requests = c.leaveRequests.filter(l => l.employeeId === empId);
  const taken = requests.filter(l => l.status === 'Approved').reduce((s,l) => s + Number(l.days||0), 0);
  const pending = requests.filter(l => l.status === 'Pending').reduce((s,l) => s + Number(l.days||0), 0);
  const emp = c.employees.find(e => e.id === empId);
  const entitlement = emp ? Number(emp.annualLeaveEntitlement ?? 21) : 21;
  return { entitlement, taken, pending, remaining: entitlement - taken };
}

async function submitLeaveRequest(evt){
  evt.preventDefault();
  const c = state.clients[state.activeClient];
  const form = evt.target;
  const employeeId = form.employeeId.value;
  const leaveType = form.leaveType.value;
  const startDate = form.startDate.value;
  const endDate = form.endDate.value;
  const notes = form.notes.value.trim();
  if(!employeeId || !startDate || !endDate){ alert('Pick an employee, start date, and end date.'); return; }
  const days = daysBetween(startDate, endDate);
  if(days <= 0){ alert('End date must be on or after the start date.'); return; }

  const { data, error } = await sb.from('leave_requests').insert({
    company_id: state.activeClient, employee_id: employeeId, leave_type: leaveType,
    start_date: startDate, end_date: endDate, days, status: 'Pending', notes
  }).select().single();
  if(error){ alert('Could not submit leave request: ' + error.message); return; }

  c.leaveRequests.unshift({ id: data.id, employeeId, leaveType, startDate, endDate, days, status: 'Pending', notes });
  render();
}

async function decideLeaveRequest(requestId, newStatus){
  const c = state.clients[state.activeClient];
  const req = c.leaveRequests.find(l => l.id === requestId);
  if(!req) return;
  const { error } = await sb.from('leave_requests').update({ status: newStatus, decided_at: new Date().toISOString() }).eq('id', requestId);
  if(error){ alert('Could not update request: ' + error.message); return; }
  req.status = newStatus;
  const emp = c.employees.find(e => e.id === req.employeeId);
  logAudit(`Leave request ${newStatus}`, `${emp ? emp.name : 'Unknown'} — ${req.leaveType} (${req.days} days)`);
  render();
}

async function deleteLeaveRequest(requestId){
  if(!confirm('Delete this leave request? This cannot be undone.')) return;
  const c = state.clients[state.activeClient];
  const { error } = await sb.from('leave_requests').delete().eq('id', requestId);
  if(error){ alert('Could not delete: ' + error.message); return; }
  c.leaveRequests = c.leaveRequests.filter(l => l.id !== requestId);
  render();
}

async function finalizePayrollRun(evt){
  const c = state.clients[state.activeClient];
  if(!requireAccess(c)) return;
  if(!c.period){ alert('Set a pay period first (top of the page) before finalizing.'); return; }
  if(blockIfClosed(c)) return;
  if(!confirm(`Finalize payroll for "${c.name || 'this client'}" — ${c.period}?\n\nThis permanently records each employee's pay for this period, which future dashboard features (trend charts, salary history) will be built on. Finalizing the same period again later just updates that period's record rather than duplicating it — safe to re-run if you correct something, right up until you close the period.`)) return;

  const btn = evt.target;
  const originalText = btn.textContent;
  btn.textContent = 'Finalizing...'; btn.disabled = true;

  const rows = c.employees.map(e => {
    const r = calcEmployee(e);
    return {
      company_id: state.activeClient,
      employee_id: e.id,
      period: c.period,
      employee_name: e.name || 'Unnamed',
      department: e.department || '',
      payroll_number: e.payrollNumber || '',
      basic: e.basic || 0,
      allowances: e.allowances || 0,
      overtime_pay: e.overtimePay || 0,
      bonus_pay: r.bonusPay,
      gross: r.gross,
      nssf_employee: r.nssfEmployee,
      nssf_employer: r.nssfEmployer,
      shif: r.shif,
      ahl_employee: r.ahlEmployee,
      ahl_employer: r.ahlEmployer,
      nita: r.nita,
      paye: r.paye,
      other_deductions: r.otherDeduct,
      net_pay: r.net,
      employer_cost: r.employerCost,
      finalized_at: new Date().toISOString()
    };
  });

  const { error } = await sb.from('payroll_runs').upsert(rows, { onConflict: 'employee_id,period' });
  if(error){ btn.textContent = originalText; btn.disabled = false; alert('Could not finalize: ' + error.message); return; }

  const periodTotals = rows.reduce((acc,r) => {
    acc.gross += r.gross; acc.net += r.net_pay; acc.paye += r.paye;
    return acc;
  }, { gross:0, net:0, paye:0 });

  const { data: periodData, error: periodError } = await sb.from('payroll_periods').upsert({
    company_id: state.activeClient, period: c.period, status: 'Processed',
    employee_count: rows.length, total_gross: periodTotals.gross, total_net: periodTotals.net, total_paye: periodTotals.paye
  }, { onConflict: 'company_id,period' }).select().single();

  btn.textContent = originalText; btn.disabled = false;
  if(periodError){ alert('Payroll data was saved, but the period status could not be updated: ' + periodError.message); return; }

  const existing = getPeriodRecord(c, c.period);
  const rec = { id: periodData.id, period: c.period, status: 'Processed', employeeCount: rows.length,
                totalGross: periodTotals.gross, totalNet: periodTotals.net, totalPaye: periodTotals.paye,
                closedBy: '', closedAt: null };
  if(existing) Object.assign(existing, rec); else c.payrollPeriods.push(rec);

  // Roll-over: one-off pay/deduction items (not marked "Recurring") are now locked into this
  // period's history via the snapshot above — clear them from the live employee record so they
  // don't silently reappear next period. Recurring items are left untouched; that's what makes
  // next period a review-and-amend process instead of re-entering everything from scratch.
  let clearedCount = 0;
  for(const e of c.employees){
    const keptDeductions = (e.deductionItems||[]).filter(isRecurring);
    const keptBonuses = (e.bonusItems||[]).filter(isRecurring);
    const deductionsChanged = keptDeductions.length !== (e.deductionItems||[]).length;
    const bonusesChanged = keptBonuses.length !== (e.bonusItems||[]).length;
    if(deductionsChanged || bonusesChanged){
      clearedCount++;
      e.deductionItems = keptDeductions;
      e.bonusItems = keptBonuses;
      await sb.from('employees').update({ deduction_items: keptDeductions, bonus_items: keptBonuses }).eq('id', e.id);
    }
  }

  logAudit('Payroll finalized', `${c.period} — ${rows.length} employee record(s)${clearedCount ? `, one-off items cleared for ${clearedCount} employee(s)` : ''}`);
  render();
  alert(`Payroll finalized for ${c.period}. ${rows.length} employee record(s) saved to history.${clearedCount ? ` One-off pay/deductions cleared for ${clearedCount} employee(s) — recurring items carry forward automatically.` : ''} You can close this period once you're satisfied it's correct — closing is permanent.`);
}

async function closePeriod(){
  const c = state.clients[state.activeClient];
  if(!c.period){ return; }
  const record = getPeriodRecord(c, c.period);
  if(!record || record.status !== 'Processed'){
    alert('Finalize this period first — a period can only be closed after payroll has been finalized for it.');
    return;
  }
  const typed = prompt(`Closing ${c.period} is PERMANENT. Once closed, nothing about this period — salaries, deductions, payslips, totals — can ever be edited or deleted again through this app, by you or anyone else with access to this client.\n\nType the period exactly (${c.period}) to confirm:`);
  if(typed === null) return;
  if(typed.trim() !== c.period){
    alert('That did not match. Nothing was closed.');
    return;
  }
  const { data: userData } = await sb.auth.getUser();
  const { data, error } = await sb.from('payroll_periods').update({
    status: 'Closed', closed_by: userData?.user?.email || '', closed_at: new Date().toISOString()
  }).eq('id', record.id).select().single();
  if(error){ alert('Could not close period: ' + error.message); return; }
  record.status = 'Closed'; record.closedBy = data.closed_by; record.closedAt = data.closed_at;
  logAudit('Payroll period closed', `${c.period} — permanently locked (${record.employeeCount} employees, net pay ${fmt(record.totalNet)})`);
  render();
  alert(`${c.period} is now closed and permanently read-only.`);
}

async function downloadAllPayslipsZip(evt){
  const c = state.clients[state.activeClient];
  if(!requireAccess(c)) return;
  if(c.employees.length === 0){ alert('No employees to generate payslips for.'); return; }

  const btn = evt.target;
  const originalText = btn.textContent;
  btn.textContent = 'Preparing ZIP...'; btn.disabled = true;

  try{
    const zip = new JSZip();
    const usedNames = {};
    c.employees.forEach(emp => {
      const { doc, filename } = generatePayslipPDF(emp.id);
      // Guard against duplicate filenames (e.g. two employees with the same name)
      let finalName = filename;
      if(usedNames[finalName]){
        usedNames[finalName]++;
        finalName = finalName.replace(/\.pdf$/, `_${usedNames[finalName]}.pdf`);
      } else {
        usedNames[finalName] = 1;
      }
      zip.file(finalName, doc.output('blob'));
    });
    const content = await zip.generateAsync({ type:'blob' });
    const url = URL.createObjectURL(content);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${(c.name||'payslips').replace(/\s+/g,'_')}_${c.period||''}_payslips.zip`;
    a.click();
    URL.revokeObjectURL(url);
  } catch(err){
    alert('Could not build the ZIP file: ' + err.message);
  } finally {
    btn.textContent = originalText; btn.disabled = false;
  }
}

async function emailAllPayslips(evt){
  const c = state.clients[state.activeClient];
  if(!requireAccess(c)) return;
  const targets = c.employees.filter(e => e.email);
  const skipped = c.employees.filter(e => !e.email);
  if(targets.length === 0){
    alert('No employees have an email address on file yet. Add emails under each employee\'s Statutory identifiers first.');
    return;
  }
  if(!confirm(`Send payslips to ${targets.length} employee(s) with an email on file?${skipped.length ? ` (${skipped.length} employee(s) will be skipped \u2014 no email on file.)` : ''}`)) return;

  const btn = evt.target;
  const originalText = btn.textContent;
  let sent = 0; const failed = [];

  for(const emp of targets){
    btn.textContent = `Sending... (${sent + failed.length + 1}/${targets.length})`;
    btn.disabled = true;
    try{
      const { doc } = generatePayslipPDF(emp.id);
      const pdfBase64 = doc.output('datauristring').split(',')[1];
      const { error } = await sb.functions.invoke('send-payslip', {
        body: { to: emp.email, employeeName: emp.name, companyName: c.name, period: c.period, pdfBase64 }
      });
      if(error) throw error;
      sent++;
    } catch(err){
      failed.push(emp.name || 'Unnamed');
    }
    await new Promise(r => setTimeout(r, 350)); // gentle pacing to avoid rate limits
  }

  btn.textContent = originalText; btn.disabled = false;
  let summary = `Sent ${sent} of ${targets.length} payslip(s).`;
  if(skipped.length) summary += ` ${skipped.length} skipped (no email on file).`;
  if(failed.length) summary += ` Failed: ${failed.join(', ')}.`;
  alert(summary);
}

    ` : '')}

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;">
      ${c.isPaid
        ? `<span style="font-size:12px;background:rgba(176,141,87,0.15);color:var(--gold);padding:5px 10px;border-radius:4px;">Active (paid)</span>
           <button class="btn" style="font-size:11.5px;padding:5px 10px;" onclick="markClientUnpaid()">Move back to trial</button>`
        : (c.trialPeriodUsed
            ? `<span style="font-size:12px;background:rgba(199,123,110,0.18);color:#C77B6E;padding:5px 10px;border-radius:4px;">Free trial used (${c.trialPeriodUsed})${c.trialPeriodUsed !== (c.period||'') ? ' \u2014 new periods blocked' : ''}</span>
               <button class="btn primary" style="font-size:11.5px;padding:5px 10px;" onclick="markClientPaid()">Mark as paid</button>`
            : `<span style="font-size:12.5px;font-weight:600;background:linear-gradient(135deg, var(--gold), #D9B876);color:var(--bg);padding:6px 12px;border-radius:5px;box-shadow:0 0 0 1px rgba(176,141,87,0.4);">✨ Free trial: 1 payroll cycle available — try it now</span>`
          )
      }
    </div>

    <div class="settings-grid" style="margin-bottom:22px;">
      <div class="settings-field"><label>Employer KRA PIN</label><input value="${esc(c.kraPin)}" placeholder="P0..." onchange="updateClientField('kraPin', this.value)"/></div>
      <div class="settings-field"><label>NSSF employer number</label><input value="${esc(c.nssfEmployerNo)}" onchange="updateClientField('nssfEmployerNo', this.value)"/></div>
      <div class="settings-field"><label>SHA employer number</label><input value="${esc(c.shaEmployerNo)}" onchange="updateClientField('shaEmployerNo', this.value)"/></div>
      <div class="settings-field"><label>Brand color (on payslip PDFs)</label>
        <div style="display:flex;gap:8px;align-items:center;">
          <input type="color" value="${c.brandColor||'#B08D57'}" style="width:40px;height:32px;padding:2px;background:var(--bg);border:1px solid var(--line);border-radius:4px;" onchange="updateClientField('brandColor', this.value); render()"/>
          <input value="${c.brandColor||'#B08D57'}" onchange="updateClientField('brandColor', this.value); render()" />
        </div>
      </div>
      <div class="settings-field">
        <label>Company logo (on payslip PDFs)</label>
        <div style="display:flex;gap:8px;align-items:center;">
          ${c.logoDataUrl ? `<img src="${c.logoDataUrl}" style="height:32px;border-radius:3px;background:#fff;padding:2px;" />` : ''}
          <button class="btn" style="font-size:11.5px;padding:6px 10px;" onclick="document.getElementById('logoFileInput').click()">${c.logoDataUrl ? 'Change' : 'Upload'}</button>
          ${c.logoDataUrl ? `<button class="btn" style="font-size:11.5px;padding:6px 10px;" onclick="removeLogo()">Remove</button>` : ''}
          <input type="file" id="logoFileInput" accept="image/*" style="display:none;" onchange="handleLogoUpload(event)" />
        </div>
      </div>
      ${c.logoDataUrl ? `
      <div class="settings-field">
        <label>Logo size on PDFs (${Math.round(c.logoSize||60)}pt wide)</label>
        <input type="range" min="24" max="140" step="2" value="${c.logoSize||60}"
          oninput="this.previousElementSibling.textContent = 'Logo size on PDFs (' + this.value + 'pt wide)'"
          onchange="updateClientField('logoSize', parseFloat(this.value)); render()"
          style="width:100%;accent-color:var(--gold);" />
      </div>` : ''}
    </div>

    ${state.settingsOpen ? renderSettings() : ''}
    ${state.activityLogOpen ? renderActivityLog(c) : ''}

    <div class="summary">
      <div class="card"><div class="label">Active employees</div><div class="value">${activeEmployees}</div></div>
      <div class="card"><div class="label">Total gross pay</div><div class="value">${fmt(totals.gross)}</div></div>
      <div class="card accent"><div class="label">Total net pay</div><div class="value">${fmt(totals.net)}</div></div>
      <div class="card deduct"><div class="label">Total PAYE</div><div class="value">${fmt(totals.paye)}</div></div>
      <div class="card deduct"><div class="label">Total NSSF/SHIF</div><div class="value">${fmt(totals.nssf + totals.shif)}</div></div>
      <div class="card"><div class="label">Total employer cost</div><div class="value">${fmt(totals.employerCost)}</div></div>
    </div>

    ${compSegments.length > 0 ? `
    <div class="composition-wrap">
      <div style="font-size:11px;color:var(--muted);margin-bottom:2px;">PAYROLL COMPOSITION — ${c.period || 'this period'}</div>
      <div style="font-size:12px;color:var(--muted);">Basic ${fmt(results.reduce((s,{e})=>s+(e.basic||0),0))} + Allowances ${fmt(results.reduce((s,{e})=>s+(e.allowances||0),0))} = Gross ${fmt(totals.gross)}</div>
      <div class="composition-bar">
        ${compSegments.map(s => `<div style="width:${(s.value/totals.gross*100).toFixed(2)}%;background:${s.color};" title="${s.label}: ${fmt(s.value)} (${(s.value/totals.gross*100).toFixed(1)}%)"></div>`).join('')}
      </div>
      <div class="composition-legend">
        ${compSegments.map(s => `<div class="composition-legend-item"><span class="composition-swatch" style="background:${s.color};"></span>${s.label}: ${fmt(s.value)} <span style="color:var(--muted);">(${(s.value/totals.gross*100).toFixed(1)}%)</span></div>`).join('')}
      </div>
    </div>` : ''}

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px;color:var(--muted);">
      <span>Show</span>
      <input type="number" min="1" value="${employeeRowLimit}" onchange="setEmployeeRowLimit(this.value)" ${showAllEmployees ? 'disabled' : ''}
        style="width:56px;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:5px 6px;font-family:'JetBrains Mono',monospace;font-size:12.5px;" />
      <span>employees per page</span>
      ${c.employees.length > employeeRowLimit ? `
        <span style="color:var(--line);">&middot;</span>
        <a style="color:var(--gold);cursor:pointer;" onclick="toggleShowAllEmployees()">${showAllEmployees ? 'Show only ' + employeeRowLimit : 'Show all ' + c.employees.length}</a>
      ` : ''}
      <span style="margin-left:auto;">Showing ${visibleResults.length} of ${c.employees.length}</span>
    </div>

    <div class="table-wrap scroll-table">
      <table>
        <colgroup>
          ${EMP_TABLE_COLS.map(col => `<col id="col-${col.key}" style="width:${getColWidth(col.key)}px;">`).join('')}
        </colgroup>
        <thead>
          <tr>
            ${EMP_TABLE_COLS.map(col => `
              <th>${esc(col.label)}${col.resizable ? `<span class="col-resize-handle" onmousedown="startColResize(event,'${col.key}')"></span>` : ''}</th>
            `).join('')}
          </tr>
        </thead>
        <tbody>
          ${visibleResults.map(({e,r}) => `
            <tr onclick="openDrawer('${e.id}')">
              <td class="row-del" onclick="event.stopPropagation(); deleteEmployeeRow('${e.id}')">&times;</td>
              <td class="name-cell" onclick="event.stopPropagation()">
                <input value="${esc(e.name)}" placeholder="Name" onchange="updateEmployeeField('${e.id}','name',this.value)" />
              </td>
              <td onclick="event.stopPropagation()"><input class="mono" type="number" value="${e.basic||''}" placeholder="0" onchange="updateEmployeeField('${e.id}','basic',this.value)" /></td>
              <td onclick="event.stopPropagation()"><input class="mono" type="number" value="${e.allowances||''}" placeholder="0" onchange="updateEmployeeField('${e.id}','allowances',this.value)" /></td>
              <td onclick="event.stopPropagation()"><input class="mono" type="number" value="${e.overtimePay||''}" placeholder="0" onchange="updateEmployeeField('${e.id}','overtimePay',this.value)" /></td>
              <td onclick="event.stopPropagation()"><input class="mono" type="number" value="${e.pension||''}" placeholder="0" onchange="updateEmployeeField('${e.id}','pension',this.value)" /></td>
              <td onclick="event.stopPropagation()"><input class="mono" type="number" value="${e.insurance||''}" placeholder="0" onchange="updateEmployeeField('${e.id}','insurance',this.value)" /></td>
              <td class="num" style="color:var(--muted);" title="Manage in the deductions panel — click the row">${fmt(r.otherDeduct)}</td>
              <td class="num">${fmt(r.nssfEmployee)}</td>
              <td class="num">${fmt(r.shif)}</td>
              <td class="num">${fmt(r.ahlEmployee)}</td>
              <td class="num">${fmt(r.paye)}</td>
              <td class="num net">${fmt(r.net)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      <button class="add-row-btn" onclick="addEmployeeRow()">+ Add employee</button>
    </div>

    ${(() => {
      const periodRecord = c.period ? getPeriodRecord(c, c.period) : null;
      const status = periodRecord ? periodRecord.status : null;
      if(status === 'Closed'){
        return `
          <div class="actions">
            <span style="font-size:12.5px;background:rgba(199,123,110,0.18);color:#C77B6E;padding:8px 14px;border-radius:5px;font-weight:600;">
              🔒 ${c.period} is CLOSED — permanently locked. Closed by ${esc(periodRecord.closedBy)} on ${periodRecord.closedAt ? new Date(periodRecord.closedAt).toLocaleDateString('en-KE') : ''}.
            </span>
          </div>
          <div style="font-size:11.5px;color:var(--muted);margin-top:-12px;margin-bottom:20px;">Switch to a different pay period above to make changes. This period's figures cannot be edited, reopened, or deleted by anyone, through any part of this app.</div>
        `;
      }
      if(status === 'Processed'){
        return `
          <div class="actions">
            <span style="font-size:12.5px;background:rgba(176,141,87,0.15);color:var(--gold);padding:8px 14px;border-radius:5px;font-weight:600;">
              🔒 ${c.period} is Processed and locked for editing.
            </span>
            <button class="btn" onclick="reopenPeriod()">Reopen payroll to amend</button>
            <button class="btn" style="border-color:#C77B6E;color:#C77B6E;" onclick="closePeriod()">Close ${c.period} permanently</button>
          </div>
          <div style="font-size:11.5px;color:var(--muted);margin-top:-12px;margin-bottom:20px;">Editing is locked until reopened — this is logged. Closing is a separate, irreversible step for once you're certain this period is final.</div>
        `;
      }
      if(status === 'Reopened'){
        return `
          <div class="actions">
            <span style="font-size:12.5px;background:rgba(110,159,199,0.18);color:#6E9FC7;padding:8px 14px;border-radius:5px;font-weight:600;">
              ✎ ${c.period} is reopened for amendment.
            </span>
            <button class="btn primary" style="background:linear-gradient(135deg, var(--gold), #D9B876);" onclick="finalizePayrollRun(event)">Process ${c.period} again</button>
          </div>
          <div style="font-size:11.5px;color:var(--muted);margin-top:-12px;margin-bottom:20px;">Make your corrections above, then process again to re-lock this period.</div>
        `;
      }
      return `
        <div class="actions">
          <button class="btn primary" style="background:linear-gradient(135deg, var(--gold), #D9B876);" onclick="finalizePayrollRun(event)">Finalize payroll for ${c.period || 'this period'}</button>
        </div>
      `;
    })()}

    <div class="actions">
      <button class="btn primary" onclick="exportCSV()">Export payroll register (CSV)</button>
      <button class="btn" onclick="exportPayrollRegisterPDF()">Export payroll register (PDF)</button>
      <button class="btn" onclick="exportKRA()">KRA P10A file</button>
      <button class="btn" onclick="exportNSSF()">NSSF return file</button>
      <button class="btn" onclick="exportSHA()">SHA/SHIF return file</button>
    </div>
    <div class="actions">
      <button class="btn" onclick="exportImportTemplate()">Download import template</button>
      <button class="btn" onclick="document.getElementById('csvFileInput').click()">Import employees (CSV)</button>
      <input type="file" id="csvFileInput" accept=".csv" style="display:none;" onchange="handleCSVImport(event)" />
      <button class="btn" onclick="downloadAllPayslipsZip(event)">Download all payslips (ZIP)</button>
      <button class="btn primary" onclick="emailAllPayslips(event)">Email all payslips</button>
    </div>
    <div class="settings-note" style="margin-top:-16px;margin-bottom:26px;max-width:640px;">
      These three exports match real KRA P10A, NSSF, and SHA sample templates column-for-column. Fill in KRA PIN, National ID, NSSF/SHA numbers, and payroll number per employee (click a row &rarr; Statutory identifiers) for a complete file, or bulk-load them with "Import employees (CSV)" using the template above. If any authority changes its template layout, bring me the new sample and I'll update the export to match.
    </div>
  `;
}

function renderSettings(){
  return `
    <div class="settings-panel">
      <h3 style="font-size:13px;color:var(--gold);font-family:'Inter',sans-serif;font-weight:600;">Statutory rates in effect</h3>
      <div class="settings-grid">
        <div class="settings-field"><label>NSSF lower limit (Tier I)</label><input type="number" value="${RATES.nssfLEL}" onchange="updateRate('nssfLEL', this.value)"/></div>
        <div class="settings-field"><label>NSSF upper limit (Tier II)</label><input type="number" value="${RATES.nssfUEL}" onchange="updateRate('nssfUEL', this.value)"/></div>
        <div class="settings-field"><label>NSSF rate (each side)</label><input type="number" step="0.001" value="${RATES.nssfRate}" onchange="updateRate('nssfRate', this.value)"/></div>
        <div class="settings-field"><label>SHIF rate</label><input type="number" step="0.001" value="${RATES.shifRate}" onchange="updateRate('shifRate', this.value)"/></div>
        <div class="settings-field"><label>SHIF minimum</label><input type="number" value="${RATES.shifMin}" onchange="updateRate('shifMin', this.value)"/></div>
        <div class="settings-field"><label>Housing Levy rate (each side)</label><input type="number" step="0.001" value="${RATES.ahlRate}" onchange="updateRate('ahlRate', this.value)"/></div>
        <div class="settings-field"><label>Personal relief (monthly)</label><input type="number" value="${RATES.personalRelief}" onchange="updateRate('personalRelief', this.value)"/></div>
        <div class="settings-field"><label>Insurance relief cap</label><input type="number" value="${RATES.insuranceReliefCap}" onchange="updateRate('insuranceReliefCap', this.value)"/></div>
        <div class="settings-field"><label>NITA levy (per employee)</label><input type="number" value="${RATES.nitaLevy}" onchange="updateRate('nitaLevy', this.value)"/></div>
      </div>
      <div class="settings-note">
        Rates shown reflect NSSF Tier limits effective 1 Feb 2026, SHIF at 2.75% of gross (min KES 300), Housing Levy at 1.5%/1.5%, and PAYE bands of 10/25/30/32.5/35%. Verify against the current KRA and NSSF gazette notices before each pay run, and update the fields above if a rate changes.
      </div>
    </div>
  `;
}

sb.auth.onAuthStateChange((event) => {
  if(event === 'PASSWORD_RECOVERY'){
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('appRoot').style.display = 'none';
    document.getElementById('resetScreen').style.display = 'flex';
  }
});
boot();
</script>
</body>
</html>
