<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kenya Payroll Register</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#0B1626;
    --panel:#12213A;
    --panel-2:#16294A;
    --gold:#B08D57;
    --red:#A5382B;
    --cream:#EFE7D6;
    --ink:#EAF0F7;
    --line:#233757;
    --muted:#8FA3C4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:500;margin:0;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .app{display:flex;min-height:100vh;}

  /* Rail */
  .rail{
    width:230px;flex-shrink:0;background:var(--panel);
    border-right:1px solid var(--line);padding:22px 16px;
  }
  .rail-title{font-size:13px;letter-spacing:.02em;color:var(--gold);font-family:'JetBrains Mono',monospace;margin-bottom:2px;}
  .rail-sub{font-size:11px;color:var(--muted);margin-bottom:20px;}
  .client-item{
    padding:9px 10px;border-radius:4px;font-size:13.5px;cursor:pointer;
    color:var(--muted);margin-bottom:2px;border:1px solid transparent;
    display:flex;justify-content:space-between;align-items:center;gap:6px;
  }
  .client-item.active{background:var(--panel-2);color:var(--ink);border-color:var(--line);}
  .client-item:hover{color:var(--ink);}
  .client-item .del{opacity:0;font-size:11px;color:var(--red);}
  .client-item:hover .del{opacity:.7;}
  .client-item .del:hover{opacity:1;}
  .add-client{
    width:100%;margin-top:10px;padding:8px 10px;background:none;
    border:1px dashed var(--line);color:var(--muted);border-radius:4px;
    font-family:'Inter',sans-serif;font-size:12.5px;cursor:pointer;
  }
  .add-client:hover{color:var(--gold);border-color:var(--gold);}
  .rail-footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);}
  .rail-btn{
    width:100%;text-align:left;background:none;border:none;color:var(--muted);
    font-family:'Inter',sans-serif;font-size:12px;padding:6px 2px;cursor:pointer;
  }
  .rail-btn:hover{color:var(--ink);}

  /* Main */
  .main{flex:1;padding:28px 34px 60px;max-width:1180px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
  .company-name-input{
    background:none;border:none;color:var(--ink);font-family:'Fraunces',serif;
    font-size:26px;font-weight:500;padding:0;outline:none;min-width:220px;
  }
  .company-name-input::placeholder{color:var(--muted);}
  .period-row{display:flex;gap:10px;align-items:center;}
  .period-row input{
    background:var(--panel);border:1px solid var(--line);color:var(--ink);
    border-radius:4px;padding:6px 10px;font-family:'JetBrains Mono',monospace;font-size:12.5px;
  }

  /* Summary cards */
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;}
  .card .label{font-size:11px;color:var(--muted);text-transform:none;margin-bottom:6px;}
  .card .value{font-family:'JetBrains Mono',monospace;font-size:19px;color:var(--ink);}
  .card.accent .value{color:var(--gold);}
  .card.deduct .value{color:#C77B6E;}

  /* Table */
  .table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:20px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;padding:10px 12px;color:var(--muted);font-weight:500;
    font-size:11px;border-bottom:1px solid var(--line);background:var(--panel-2);white-space:nowrap;
  }
  tbody td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:rgba(176,141,87,0.05);cursor:pointer;}
  td input{
    width:100%;background:none;border:none;color:var(--ink);font-family:'JetBrains Mono',monospace;
    font-size:13px;padding:2px 0;outline:none;border-bottom:1px solid transparent;
  }
  td input:focus{border-bottom:1px solid var(--gold);}
  td.name-cell input{font-family:'Inter',sans-serif;font-size:13.5px;}
  td.num{font-family:'JetBrains Mono',monospace;text-align:right;}
  td.num.net{color:var(--gold);font-weight:600;}
  .row-del{color:var(--muted);opacity:0;cursor:pointer;font-size:14px;padding:0 4px;}
  tr:hover .row-del{opacity:.6;}
  .row-del:hover{opacity:1;color:var(--red);}
  .add-row-btn{
    display:block;width:100%;text-align:left;padding:10px 12px;background:none;
    border:none;color:var(--muted);font-family:'Inter',sans-serif;font-size:12.5px;cursor:pointer;
  }
  .add-row-btn:hover{color:var(--gold);}

  .actions{display:flex;gap:10px;margin-bottom:30px;}
  .btn{
    padding:8px 14px;border-radius:4px;font-family:'Inter',sans-serif;font-size:12.5px;
    cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  }
  .btn:hover{border-color:var(--gold);color:var(--gold);}
  .btn.primary{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:600;}
  .btn.primary:hover{opacity:.9;color:var(--bg);}

  /* Drawer */
  .drawer-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:10;
  }
  .drawer-backdrop.open{display:block;}
  .drawer{
    position:fixed;top:0;right:0;height:100%;width:380px;max-width:92vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:11;
    padding:26px 26px 30px;transform:translateX(100%);transition:transform .25s ease;
    overflow-y:auto;
  }
  .drawer.open{transform:translateX(0);}
  .drawer h2{font-size:22px;margin-bottom:2px;}
  .drawer .role{color:var(--muted);font-size:12.5px;margin-bottom:20px;}
  .payslip-section{margin-bottom:18px;}
  .payslip-section h3{font-size:11px;text-transform:none;color:var(--gold);font-family:'Inter',sans-serif;font-weight:600;margin-bottom:8px;letter-spacing:.02em;}
  .payslip-line{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px solid var(--line);}
  .payslip-line span:last-child{font-family:'JetBrains Mono',monospace;}
  .payslip-line.total{font-weight:600;border-bottom:none;padding-top:8px;}
  .payslip-line.net span:last-child{color:var(--gold);font-size:16px;}
  .close-drawer{position:absolute;top:22px;right:22px;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;}
  .close-drawer:hover{color:var(--ink);}

  /* Settings panel */
  .settings-panel{
    background:var(--panel);border:1px solid var(--line);border-radius:6px;
    padding:18px 20px;margin-bottom:24px;
  }
  .settings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-top:12px;}
  .settings-field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;}
  .settings-field input{
    width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);
    border-radius:4px;padding:6px 8px;font-family:'JetBrains Mono',monospace;font-size:12.5px;
  }
  .settings-note{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.5;}
  .empty-state{padding:60px 20px;text-align:center;color:var(--muted);}
  .empty-state h2{color:var(--ink);margin-bottom:8px;}

  /* Auth screen */
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .auth-box{width:340px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:32px;}
  .auth-box h1{font-size:22px;margin-bottom:4px;}
  .auth-box .sub{color:var(--muted);font-size:12.5px;margin-bottom:22px;}
  .auth-field{margin-bottom:14px;}
  .auth-field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;}
  .auth-field input{
    width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);
    border-radius:4px;padding:9px 10px;font-family:'Inter',sans-serif;font-size:13.5px;
  }
  .auth-error{color:#C77B6E;font-size:12.5px;margin-bottom:12px;min-height:16px;}
  .auth-toggle{margin-top:16px;font-size:12.5px;color:var(--muted);text-align:center;}
  .auth-toggle a{color:var(--gold);cursor:pointer;text-decoration:none;}
  .user-badge{font-size:11.5px;color:var(--muted);padding:6px 2px;border-top:1px solid var(--line);margin-top:6px;padding-top:12px;word-break:break-all;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<body>

<div id="authScreen" class="auth-wrap" style="display:none;">
  <div class="auth-box">
    <h1 id="authTitle">Sign in</h1>
    <div class="sub">Finlens Africa &middot; Payroll</div>
    <div class="auth-error" id="authError"></div>
    <div class="auth-field"><label>Email</label><input type="email" id="authEmail" /></div>
    <div class="auth-field"><label>Password</label><input type="password" id="authPassword" onkeydown="if(event.key==='Enter') handleAuthSubmit()" /></div>
    <button class="btn primary" style="width:100%;" id="authSubmit" onclick="handleAuthSubmit()">Sign in</button>
    <div class="auth-toggle" id="authToggle">No account yet? <a onclick="toggleAuthMode()">Create one</a></div>

</div>

<div class="app" id="appRoot" style="display:none;">
  <div class="rail">
    <div class="rail-title">FINLENS AFRICA</div>
    <div class="rail-sub">Payroll &middot; Kenya</div>
    <div id="clientList"></div>
    <button class="add-client" onclick="addClient()">+ Add client</button>
    <div class="rail-footer">
      <button class="rail-btn" onclick="toggleSettings()">Statutory rates &amp; settings</button>
      <button class="rail-btn" onclick="handleSignOut()">Sign out</button>
      <div class="user-badge" id="userBadge"></div>
    </div>
  </div>

  <div class="main" id="mainArea"></div>
</div>

<div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <button class="close-drawer" onclick="closeDrawer()">&times;</button>
  <div id="drawerContent"></div>
</div>

<script>
/* ---------------------------------------------------------------------
   STATUTORY RATE CONFIG — Kenya, effective 1 Feb 2026.
   Update these if KRA / NSSF / SHIF gazette new rates. Values also
   editable live from the "Statutory rates & settings" panel.
--------------------------------------------------------------------- */
let RATES = {
  nssfLEL: 9000,        // Tier I lower earnings limit
  nssfUEL: 108000,      // Tier II upper earnings limit
  nssfRate: 0.06,        // employee & employer, each
  shifRate: 0.0275,      // % of gross
  shifMin: 300,          // minimum monthly SHIF
  ahlRate: 0.015,        // Affordable Housing Levy, employee & employer, each
  personalRelief: 2400,  // monthly
  insuranceReliefRate: 0.15,
  insuranceReliefCap: 5000,
  pensionReliefCap: 30000, // combined statutory + voluntary pension relief cap
  nitaLevy: 50,          // per employee per month, employer cost
  bands: [
    { upTo: 24000, rate: 0.10 },
    { upTo: 32333, rate: 0.25 },
    { upTo: 500000, rate: 0.30 },
    { upTo: 800000, rate: 0.325 },
    { upTo: Infinity, rate: 0.35 }
  ]
};

/* ---------------------------------------------------------------------
   SUPABASE CONFIG — paste your project's values here.
   Dashboard → Project Settings → API → Project URL / anon public key.
   The anon key is safe to expose in frontend code; Row Level Security
   (see schema.sql) is what actually restricts access to each user's own data.
--------------------------------------------------------------------- */
const SUPABASE_URL = 'https://fmargcknmofzpihujzdc.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_2-DM351xvcU2tXUIuX-vQg_CTpuRD3q';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let state = { clients: {}, activeClient: null, settingsOpen: false };
let authMode = 'signin'; // or 'signup'

function fmt(n){
  n = Math.round(n||0);
  if(n === 0) return '-';
  return n.toLocaleString('en-KE');
}
const TEXT_FIELDS = ['name','pin','idNumber','nssfNo','shaNo','payrollNumber','phone','email',
                      'residentialStatus','employeeType','disability','exemptionCertNo',
                      'benefitDescription','identityType'];
const EMP_DB_FIELD = { name:'name', pin:'pin', idNumber:'id_number', nssfNo:'nssf_no', shaNo:'sha_no',
                        basic:'basic', allowances:'allowances', pension:'pension', insurance:'insurance', deductionItems:'deduction_items',
                        payrollNumber:'payroll_number', phone:'phone', email:'email', residentialStatus:'residential_status',
                        employeeType:'employee_type', disability:'disability', exemptionCertNo:'exemption_cert_no',
                        benefitDescription:'benefit_description', benefitAmount:'benefit_amount', identityType:'identity_type' };
const CLIENT_DB_FIELD = { name:'name', period:'period', kraPin:'kra_pin', nssfEmployerNo:'nssf_employer_no', shaEmployerNo:'sha_employer_no',
                           brandColor:'brand_color', logoDataUrl:'logo_data_url', logoSize:'logo_size', logoAspect:'logo_aspect' };

function hexToRgb(hex){
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec((hex||'').trim());
  if(!m) return [176,141,87]; // fallback gold
  return [parseInt(m[1],16), parseInt(m[2],16), parseInt(m[3],16)];
}

const DEDUCTION_TYPES = ['Salary Advance','Loan Repayment','Damaged Asset/Equipment','Union Dues','Other'];

function sumDeductions(items){
  return (items||[]).reduce((s,d) => s + (parseFloat(d.amount)||0), 0);
}

function splitName(fullName){
  const parts = (fullName||'').trim().split(/\s+/).filter(Boolean);
  if(parts.length === 0) return { surname:'', otherNames:'' };
  if(parts.length === 1) return { surname: parts[0], otherNames:'' };
  return { surname: parts[parts.length-1], otherNames: parts.slice(0,-1).join(' ') };
}

function calcPAYE(taxable){
  let remaining = taxable, tax = 0, lower = 0;
  for(const b of RATES.bands){
    const bandAmount = Math.max(0, Math.min(remaining, b.upTo - lower));
    tax += bandAmount * b.rate;
    remaining -= bandAmount;
    lower = b.upTo;
    if(remaining <= 0) break;
  }
  return tax;
}

function calcEmployee(e){
  const basic = Number(e.basic)||0;
  const allowances = Number(e.allowances)||0;
  const gross = basic + allowances;

  const tier1 = Math.min(basic, RATES.nssfLEL) * RATES.nssfRate;
  const tier2 = Math.max(0, Math.min(basic, RATES.nssfUEL) - RATES.nssfLEL) * RATES.nssfRate;
  const nssfEmployee = tier1 + tier2;
  const nssfEmployer = nssfEmployee;

  const shif = gross > 0 ? Math.max(gross * RATES.shifRate, RATES.shifMin) : 0;
  const ahlEmployee = gross * RATES.ahlRate;
  const ahlEmployer = gross * RATES.ahlRate;

  const voluntaryPension = Math.min(Number(e.pension)||0, Math.max(0, RATES.pensionReliefCap - nssfEmployee));

  const taxable = Math.max(0, gross - nssfEmployee - shif - ahlEmployee - voluntaryPension);
  const grossTax = calcPAYE(taxable);
  const insuranceRelief = Math.min((Number(e.insurance)||0) * RATES.insuranceReliefRate, RATES.insuranceReliefCap);
  const paye = Math.max(0, grossTax - RATES.personalRelief - insuranceRelief);

  const otherDeduct = sumDeductions(e.deductionItems);
  const totalDeductions = nssfEmployee + shif + ahlEmployee + voluntaryPension + paye + otherDeduct;
  const net = gross - totalDeductions;

  const nita = gross > 0 ? RATES.nitaLevy : 0;
  const employerCost = gross + nssfEmployer + ahlEmployer + nita;

  return { gross, nssfEmployee, nssfEmployer, shif, ahlEmployee, ahlEmployer,
           voluntaryPension, taxable, grossTax, insuranceRelief, paye,
           otherDeduct, totalDeductions, net, nita, employerCost };
}

/* ---------------- Auth ---------------- */
function showAuthError(msg){ document.getElementById('authError').textContent = msg || ''; }
function toggleAuthMode(){
  authMode = authMode === 'signin' ? 'signup' : 'signin';
  document.getElementById('authTitle').textContent = authMode === 'signin' ? 'Sign in' : 'Create account';
  document.getElementById('authSubmit').textContent = authMode === 'signin' ? 'Sign in' : 'Create account';
  document.getElementById('authToggle').innerHTML = authMode === 'signin'
    ? `No account yet? <a onclick="toggleAuthMode()">Create one</a>`
    : `Already have an account? <a onclick="toggleAuthMode()">Sign in</a>`;
  showAuthError('');
}
async function handleAuthSubmit(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  showAuthError('');
  if(!email || !password){ showAuthError('Enter an email and password.'); return; }
  const fn = authMode === 'signin' ? sb.auth.signInWithPassword : sb.auth.signUp;
  const { error } = await fn.call(sb.auth, { email, password });
  if(error){ showAuthError(error.message); return; }
  if(authMode === 'signup'){
    showAuthError('Account created. Check your email if confirmation is required, then sign in.');
    return;
  }
  await boot();
}
async function handleSignOut(){
  await sb.auth.signOut();
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('authScreen').style.display = 'flex';
}

/* ---------------- Data layer (Supabase) ---------------- */
async function fetchAllData(){
  const { data: companies, error } = await sb.from('companies').select('*').order('created_at');
  if(error){ alert('Could not load clients: ' + error.message); return; }
  state.clients = {};
  for(const c of companies){
    const { data: employees } = await sb.from('employees').select('*').eq('company_id', c.id).order('created_at');
    state.clients[c.id] = {
      name: c.name, period: c.period, kraPin: c.kra_pin,
      nssfEmployerNo: c.nssf_employer_no, shaEmployerNo: c.sha_employer_no,
      brandColor: c.brand_color || '#B08D57', logoDataUrl: c.logo_data_url || '',
      logoSize: c.logo_size || 60, logoAspect: c.logo_aspect || 0.75,
      employees: (employees||[]).map(e => ({
        id: e.id, name: e.name, pin: e.pin, idNumber: e.id_number, nssfNo: e.nssf_no, shaNo: e.sha_no,
        basic: e.basic, allowances: e.allowances, pension: e.pension, insurance: e.insurance, deductionItems: e.deduction_items || [],
        payrollNumber: e.payroll_number||'', phone: e.phone||'', email: e.email||'', residentialStatus: e.residential_status||'Resident',
        employeeType: e.employee_type||'Primary Employee', disability: e.disability||'No', exemptionCertNo: e.exemption_cert_no||'',
        benefitDescription: e.benefit_description||'Benefit not given', benefitAmount: e.benefit_amount||0, identityType: e.identity_type||'National ID'
      }))
    };
  }
  if(companies.length === 0){
    await addClient();
  } else {
    state.activeClient = companies[0].id;
  }
}
async function loadRates(){
  const { data: userData } = await sb.auth.getUser();
  const { data } = await sb.from('statutory_rates').select('rates').eq('user_id', userData.user.id).maybeSingle();
  if(data && data.rates) RATES = Object.assign(RATES, data.rates);
}
async function saveRates(){
  const { data: userData } = await sb.auth.getUser();
  await sb.from('statutory_rates').upsert({ user_id: userData.user.id, rates: RATES });
}

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('appRoot').style.display = 'none';
    return;
  }
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = 'flex';
  document.getElementById('userBadge').textContent = session.user.email;
  await loadRates();
  await fetchAllData();
  render();
}

/* ---------------- Actions ---------------- */
async function handleLogoUpload(event){
  const file = event.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ alert('Please choose an image file.'); return; }

  const dataUrl = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });

  // Resize down to a sane max width so we're not storing multi-MB phone photos in the database.
  // Aspect ratio is captured here and stored separately, so the PDF render never distorts the logo
  // regardless of what size the user picks later.
  const { resized, aspect } = await new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 320;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve({ resized: canvas.toDataURL('image/png'), aspect: img.height / img.width });
    };
    img.src = dataUrl;
  });

  const c = state.clients[state.activeClient];
  c.logoDataUrl = resized; c.logoAspect = aspect;
  await sb.from('companies').update({ logo_data_url: resized, logo_aspect: aspect }).eq('id', state.activeClient);
  render();
}

function removeLogo(){
  updateClientField('logoDataUrl', '');
  render();
}

async function addClient(){
  const { data: userData } = await sb.auth.getUser();
  const { data, error } = await sb.from('companies').insert({ user_id: userData.user.id, name: 'Untitled Client' }).select().single();
  if(error){ alert(error.message); return; }
  state.clients[data.id] = { name: data.name, period:'', kraPin:'', nssfEmployerNo:'', shaEmployerNo:'',
                              brandColor:'#B08D57', logoDataUrl:'', logoSize:60, logoAspect:0.75, employees: [] };
  state.activeClient = data.id;
  await addEmployeeRow();
}
async function deleteClient(id, ev){
  ev.stopPropagation();
  if(!confirm('Remove this client and its payroll data?')) return;
  const { error } = await sb.from('companies').delete().eq('id', id);
  if(error){ alert(error.message); return; }
  delete state.clients[id];
  const names = Object.keys(state.clients);
  if(names.length === 0){
    await addClient();
  } else if(state.activeClient === id){
    state.activeClient = names[0];
  }
  render();
}
function selectClient(id){ state.activeClient = id; render(); }
async function updateClientField(field, value){
  state.clients[state.activeClient][field] = value;
  const { error } = await sb.from('companies').update({ [CLIENT_DB_FIELD[field]]: value }).eq('id', state.activeClient);
  if(error) console.error(error);
}
async function addEmployeeRow(){
  const { data, error } = await sb.from('employees').insert({ company_id: state.activeClient }).select().single();
  if(error){ alert(error.message); return; }
  state.clients[state.activeClient].employees.push({
    id: data.id, name:'', pin:'', idNumber:'', nssfNo:'', shaNo:'',
    basic:0, allowances:0, pension:0, insurance:0, deductionItems:[],
    payrollNumber:'', phone:'', email:'', residentialStatus:'Resident', employeeType:'Primary Employee',
    disability:'No', exemptionCertNo:'', benefitDescription:'Benefit not given', benefitAmount:0, identityType:'National ID'
  });
  render();
}
async function deleteEmployeeRow(empId){
  const { error } = await sb.from('employees').delete().eq('id', empId);
  if(error){ alert(error.message); return; }
  const c = state.clients[state.activeClient];
  c.employees = c.employees.filter(e => e.id !== empId);
  if(c.employees.length === 0){ await addEmployeeRow(); return; }
  render();
}
async function updateEmployeeField(empId, field, value){
  const c = state.clients[state.activeClient];
  const emp = c.employees.find(e => e.id === empId);
  emp[field] = TEXT_FIELDS.includes(field) ? value : (parseFloat(value) || 0);
  render();
  const { error } = await sb.from('employees').update({ [EMP_DB_FIELD[field]]: emp[field] }).eq('id', empId);
  if(error) console.error(error);
}

const _deductionSaveTimers = {};
async function saveDeductionItems(empId, items){
  const { error } = await sb.from('employees').update({ deduction_items: items }).eq('id', empId);
  if(error) console.error(error);
}
function saveDeductionItemsDebounced(empId, items){
  clearTimeout(_deductionSaveTimers[empId]);
  _deductionSaveTimers[empId] = setTimeout(() => saveDeductionItems(empId, items), 500);
}
function addDeductionItem(empId){
  const c = state.clients[state.activeClient];
  const emp = c.employees.find(e => e.id === empId);
  if(!emp.deductionItems) emp.deductionItems = [];
  emp.deductionItems.push({ type: DEDUCTION_TYPES[0], description:'', amount: 0 });
  saveDeductionItems(empId, emp.deductionItems);
  openDrawer(empId);
}
function refreshDrawerTotals(empId){
  const c = state.clients[state.activeClient];
  const emp = c.employees.find(e => e.id === empId);
  if(!emp) return;
  const r = calcEmployee(emp);
  const totalEl = document.getElementById('drawerOtherDeductTotal');
  if(totalEl) totalEl.textContent = fmt(r.otherDeduct);
  const netEl = document.getElementById('drawerNetPay');
  if(netEl) netEl.textContent = 'KES ' + fmt(r.net);
}
function updateDeductionItem(empId, idx, field, value){
  const c = state.clients[state.activeClient];
  const emp = c.employees.find(e => e.id === empId);
  emp.deductionItems[idx][field] = field === 'amount' ? (parseFloat(value)||0) : value;
  if(field === 'amount'){
    saveDeductionItemsDebounced(empId, emp.deductionItems);
  } else {
    saveDeductionItems(empId, emp.deductionItems);
  }
  render(); // safe: only touches the main table/rail, never the open drawer, so focus is never lost
  if(field === 'type'){
    openDrawer(empId); // dropdown selection isn't continuous typing, a full refresh here is fine
  } else {
    refreshDrawerTotals(empId); // patches just the total + net pay figures live, without rebuilding inputs mid-keystroke
  }
}
function removeDeductionItem(empId, idx){
  const c = state.clients[state.activeClient];
  const emp = c.employees.find(e => e.id === empId);
  emp.deductionItems.splice(idx, 1);
  saveDeductionItems(empId, emp.deductionItems);
  render();
  openDrawer(empId);
}

function generatePayslipPDF(empId){
  const c = state.clients[state.activeClient];
  const emp = c.employees.find(e => e.id === empId);
  const r = calcEmployee(emp);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format: [297.64, 841.89] }); // A4 height kept as-is; width halved, per instruction
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const left = 32; const right = pageWidth - 32; let y = 40;
  const [br, bg, bb] = hexToRgb(c.brandColor || '#B08D57');

  const line = (label, value, opts={}) => {
    doc.setFont('helvetica', opts.bold ? 'bold' : 'normal');
    doc.setFontSize(opts.size || 9.5);
    doc.text(label, left, y);
    doc.text(String(value), right, y, { align:'right' });
    y += opts.gap || 14;
  };
  const section = (title) => {
    y += 5;
    doc.setDrawColor(180); doc.line(left, y, right, y); y += 15;
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.setTextColor(br, bg, bb);
    doc.text(title.toUpperCase(), left, y);
    doc.setTextColor(20,20,20);
    y += 15;
  };
  const centerX = pageWidth / 2;

  // Header block: logo, company name, "PAYSLIP" title, pay period — all centered.
  y += 6;
  if(c.logoDataUrl){
    try{
      const logoW = Math.min(c.logoSize || 60, 70);
      const logoH = logoW * (c.logoAspect || 0.75);
      doc.addImage(c.logoDataUrl, 'PNG', centerX - logoW / 2, y, logoW, logoH);
      y += logoH + 10;
    }catch(e){ /* ignore malformed image, don't block payslip generation */ }
  }

  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.setTextColor(br, bg, bb);
  doc.text(c.name || 'Payslip', centerX, y, { align:'center' });
  y += 17;

  doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.setTextColor(20,20,20);
  doc.text('PAYSLIP', centerX, y, { align:'center' });
  y += 13;

  doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  doc.setTextColor(90,90,90);
  doc.text(`Pay Period: ${c.period || '-'}`, centerX, y, { align:'center' });
  doc.setTextColor(20,20,20);
  y += 16;

  // Bold rule, then a dotted rule beneath it, closing out the header block.
  doc.setLineWidth(1.4); doc.setDrawColor(20,20,20);
  doc.line(left, y, right, y);
  y += 5;
  doc.setLineWidth(0.75); doc.setLineDashPattern([1.5, 1.5], 0);
  doc.line(left, y, right, y);
  doc.setLineDashPattern([], 0); doc.setLineWidth(1);
  y += 16;

  // Remaining identifying fields, left-aligned as before.
  line('Employer PIN', c.kraPin || '-');
  line('Employee Name', emp.name || 'Unnamed');
  line('Payroll Number', emp.payrollNumber || '-');
  line('KRA PIN', emp.pin || '-');
  y += 4;

  section('Earnings');
  line('Basic salary', fmt(emp.basic));
  line('Allowances', fmt(emp.allowances));
  line('Gross pay', fmt(r.gross), { bold:true });

  section('Statutory deductions');
  line('NSSF (Tier I + II)', fmt(r.nssfEmployee));
  line('SHIF (2.75%)', fmt(r.shif));
  line('Housing Levy (1.5%)', fmt(r.ahlEmployee));
  if(r.voluntaryPension) line('Voluntary pension', fmt(r.voluntaryPension));
  y += 4;
  line('Taxable pay', fmt(r.taxable));
  line('Tax on taxable pay', fmt(r.grossTax));
  line('Less: personal relief', `-${fmt(RATES.personalRelief)}`);
  if(r.insuranceRelief) line('Less: insurance relief', `-${fmt(r.insuranceRelief)}`);
  line('PAYE', fmt(r.paye), { bold:true });

  const hasOtherDeductions = (emp.deductionItems||[]).some(d => d.amount);
  if(hasOtherDeductions){
    section('Other deductions');
    (emp.deductionItems||[]).forEach(d => {
      if(d.amount) line(d.description ? `${d.type}: ${d.description}` : d.type, fmt(d.amount));
    });
    line('Total other deductions', fmt(r.otherDeduct), { bold:true });
  }

  section('Net pay');
  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.setTextColor(br, bg, bb);
  doc.text('Take-home pay', left, y);
  doc.text(`KES ${fmt(r.net)}`, right, y, { align:'right' });
  doc.setTextColor(20,20,20);
  y += 26;

  doc.setFont('helvetica','italic'); doc.setFontSize(7.5); doc.setTextColor(140,140,140);
  doc.text('Generated by Finlens Africa. Verify statutory figures against current KRA/NSSF/SHA rates.', left, pageHeight - 24, { maxWidth: pageWidth - left * 2 });

  return { doc, filename: `${(emp.name||'employee').replace(/\s+/g,'_')}_payslip_${c.period||''}.pdf` };
}

function downloadPayslipPDF(empId){
  const { doc, filename } = generatePayslipPDF(empId);
  doc.save(filename);
}

async function emailPayslip(empId, evt){
  const c = state.clients[state.activeClient];
  const emp = c.employees.find(e => e.id === empId);
  if(!emp.email){
    const addr = prompt('Enter this employee\'s email address:');
    if(!addr) return;
    await updateEmployeeField(empId, 'email', addr);
    emp.email = addr;
  }
  const { doc } = generatePayslipPDF(empId);
  const pdfBase64 = doc.output('datauristring').split(',')[1];
  const btn = evt.target;
  const originalText = btn.textContent;
  btn.textContent = 'Sending...'; btn.disabled = true;
  try{
    const { data, error } = await sb.functions.invoke('send-payslip', {
      body: {
        to: emp.email,
        employeeName: emp.name,
        companyName: c.name,
        period: c.period,
        pdfBase64
      }
    });
    if(error) throw error;
    alert(`Payslip sent to ${emp.email}`);
  } catch(err){
    alert('Could not send email: ' + (err.message || 'the email function may not be set up yet.'));
  } finally {
    btn.textContent = originalText; btn.disabled = false;
  }
}

function downloadCSV(rows, filename){
  const csv = rows.map(row => row.map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function exportKRA(){
  // Matches the KRA iTax P10A "Simplified" employee details format — no header row,
  // 25 fixed-position columns. Verified against a real KRA-generated sample.
  const c = state.clients[state.activeClient];
  const rows = c.employees.map(e=>{
    const r = calcEmployee(e);
    return [
      e.pin || '',
      e.name || '',
      e.residentialStatus || 'Resident',
      e.employeeType || 'Primary Employee',
      e.disability || 'No',
      e.disability === 'Yes' ? (e.exemptionCertNo||'') : '',
      e.basic || 0,
      e.allowances || 0,
      0,                                  // value of quarters
      e.benefitAmount || 0,               // other non-cash benefit value
      e.benefitDescription || 'Benefit not given',
      '',
      0,
      '',
      Math.round(r.shif * 100) / 100,
      Math.round(r.nssfEmployee * 100) / 100,
      0,                                  // owner occupied interest
      0,                                  // additional retirement contribution
      0,                                  // post retirement medical fund
      Math.round(r.ahlEmployee * 100) / 100,
      '',
      RATES.personalRelief,
      Math.round(r.insuranceRelief * 100) / 100,
      '',
      Math.round(r.paye * 100) / 100
    ];
  });
  downloadCSV(rows, `${(c.name||'client').replace(/\s+/g,'_')}_P10A_${c.period||''}.csv`);
}

function exportNSSF(){
  // Matches the NSSF new-format upload: PAYROLL NUMBER, SURNAME, OTHER NAMES, ID NO, KRA PIN, NSSF NO, GROSS PAY, VOLUNTARY
  const c = state.clients[state.activeClient];
  const rows = [['PAYROLL NUMBER','SURNAME','OTHER NAMES','ID NO','KRA PIN','NSSF NO','GROSS PAY','VOLUNTARY']];
  c.employees.forEach(e=>{
    const { surname, otherNames } = splitName(e.name);
    const r = calcEmployee(e);
    rows.push([e.payrollNumber||'', surname, otherNames, e.idNumber||'', e.pin||'', e.nssfNo||'', Math.round(r.gross), 0]);
  });
  downloadCSV(rows, `${(c.name||'client').replace(/\s+/g,'_')}_NSSF_${c.period||''}.csv`);
}

function exportSHA(){
  // Matches the SHA/SHIF upload: PAYROLL NUMBER, FIRSTNAME, LASTNAME, IDENTITY TYPE, ID NO, KRA PIN, NHIF NO, CONTRIBUTION AMOUNT, PHONE
  const c = state.clients[state.activeClient];
  const rows = [['PAYROLL NUMBER','FIRSTNAME','LASTNAME','IDENTITY TYPE','ID NO','KRA PIN','NHIF NO','CONTRIBUTION AMOUNT','PHONE']];
  c.employees.forEach(e=>{
    const { surname, otherNames } = splitName(e.name);
    const r = calcEmployee(e);
    rows.push([e.payrollNumber||'', otherNames, surname, e.identityType||'National ID', e.idNumber||'', e.pin||'', e.shaNo||'', Math.round(r.shif), e.phone||'']);
  });
  downloadCSV(rows, `${(c.name||'client').replace(/\s+/g,'_')}_SHA_SHIF_${c.period||''}.csv`);

const IMPORT_HEADERS = [
  'Payroll Number','National ID','Name','Phone','Email','KRA PIN','NSSF Number','SHA Number','Basic Salary',
  'Allowances','Pension','Insurance Premium','Other Deductions',
  'Residential Status','Employee Type','Disability','Exemption Certificate No',
  'Identity Type','Benefit Description','Benefit Amount'
];
const IMPORT_FIELD_MAP = {
  'name':'name', 'kra pin':'pin', 'national id':'idNumber', 'nssf number':'nssfNo', 'sha number':'shaNo',
  'payroll number':'payrollNumber', 'phone':'phone', 'email':'email', 'basic salary':'basic', 'allowances':'allowances',
  'pension':'pension', 'insurance premium':'insurance', 'other deductions':'otherDeduct',
  'residential status':'residentialStatus', 'employee type':'employeeType', 'disability':'disability',
  'exemption certificate no':'exemptionCertNo', 'identity type':'identityType',
  'benefit description':'benefitDescription', 'benefit amount':'benefitAmount'
};
const IMPORT_NUMERIC_FIELDS = ['basic','allowances','pension','insurance','otherDeduct','benefitAmount'];

function exportImportTemplate(){
  const rows = [IMPORT_HEADERS, [
    'HPL001','25907329','James Mbugua Njunge','0700000000','james@example.com','A005431465N','2025146591','25907329','30000',
    '0','0','0','0','Resident','Primary Employee','No','','National ID','Benefit not given','0'
  ]];
  downloadCSV(rows, 'employee_import_template.csv');
}

function parseCSVText(text){
  // Minimal RFC-4180 style parser: handles quoted fields, escaped quotes, commas inside quotes.
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i], next = text[i+1];
    if(inQuotes){
      if(ch === '"' && next === '"'){ field += '"'; i++; }
      else if(ch === '"'){ inQuotes = false; }
      else field += ch;
    } else {
      if(ch === '"') inQuotes = true;
      else if(ch === ','){ row.push(field); field = ''; }
      else if(ch === '\r'){ /* skip */ }
      else if(ch === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else field += ch;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}

async function handleCSVImport(event){
  const file = event.target.files[0];
  if(!file) return;
  const text = await file.text();
  const rows = parseCSVText(text);
  if(rows.length < 2){ alert('That file has no data rows to import.'); event.target.value = ''; return; }

  const headerRow = rows[0].map((h, i) => (i === 0 ? h.replace(/^\uFEFF/, '') : h).trim().toLowerCase());
  const dataRows = rows.slice(1);

  const newEmployees = dataRows.map(cells => {
    const emp = {
      name:'', pin:'', idNumber:'', nssfNo:'', shaNo:'', payrollNumber:'', phone:'', email:'',
      basic:0, allowances:0, pension:0, insurance:0, otherDeduct:0,
      residentialStatus:'Resident', employeeType:'Primary Employee', disability:'No',
      exemptionCertNo:'', identityType:'National ID', benefitDescription:'Benefit not given', benefitAmount:0
    };
    headerRow.forEach((h, i) => {
      const field = IMPORT_FIELD_MAP[h];
      if(!field) return;
      let raw = (cells[i]||'').trim();
      if(raw.startsWith("'")) raw = raw.slice(1); // strip Excel's text-protection apostrophe (e.g. on NSSF/ID numbers)
      if(IMPORT_NUMERIC_FIELDS.includes(field)){
        raw = raw.replace(/,/g, ''); // strip thousand separators (e.g. "30,000.00") before parsing
        emp[field] = parseFloat(raw) || 0;
      } else {
        emp[field] = raw;
      }
    });
    // The single "Other Deductions" import column becomes one "Other" line item,
    // since deductions are now tracked as a categorized list per employee.
    emp.deductionItems = emp.otherDeduct ? [{ type:'Other', description:'Imported', amount: emp.otherDeduct }] : [];
    delete emp.otherDeduct;
    return emp;
  }).filter(e => e.name); // skip rows with no name

  if(newEmployees.length === 0){
    alert('No valid rows found. Make sure the CSV has a "Name" column with values.');
    event.target.value = '';
    return;
  }

  const companyId = state.activeClient;
  const dbRows = newEmployees.map(e => ({
    company_id: companyId, name: e.name, pin: e.pin, id_number: e.idNumber, nssf_no: e.nssfNo, sha_no: e.shaNo,
    payroll_number: e.payrollNumber, phone: e.phone, email: e.email, basic: e.basic, allowances: e.allowances,
    pension: e.pension, insurance: e.insurance, deduction_items: e.deductionItems,
    residential_status: e.residentialStatus, employee_type: e.employeeType, disability: e.disability,
    exemption_cert_no: e.exemptionCertNo, identity_type: e.identityType,
    benefit_description: e.benefitDescription, benefit_amount: e.benefitAmount
  }));

  const { data, error } = await sb.from('employees').insert(dbRows).select();
  if(error){ alert('Import failed: ' + error.message); event.target.value = ''; return; }

  const c = state.clients[companyId];
  data.forEach((row, idx) => {
    c.employees.push({ id: row.id, ...newEmployees[idx] });
  });
  render();
  alert(`Imported ${data.length} employee${data.length===1?'':'s'}.`);
  event.target.value = '';
}

function exportCSV(){
  const c = state.clients[state.activeClient];
  const rows = [[
    'Name','Basic','Allowances','Gross',
    'NSSF (Employee)','NSSF (Employer)',
    'SHIF','Housing Levy (Employee)','Housing Levy (Employer)','NITA Levy (Employer)',
    'PAYE','Other Deductions','Net Pay','Total Employer Cost'
  ]];
  let t = { nssfE:0, nssfEr:0, shif:0, ahlE:0, ahlEr:0, nita:0, paye:0, otherD:0, net:0, employerCost:0, gross:0 };
  c.employees.forEach(e=>{
    const r = calcEmployee(e);
    rows.push([e.name, e.basic, e.allowances, Math.round(r.gross),
      Math.round(r.nssfEmployee), Math.round(r.nssfEmployer),
      Math.round(r.shif), Math.round(r.ahlEmployee), Math.round(r.ahlEmployer), Math.round(r.nita),
      Math.round(r.paye), Math.round(r.otherDeduct), Math.round(r.net), Math.round(r.employerCost)]);
    t.gross+=r.gross; t.nssfE+=r.nssfEmployee; t.nssfEr+=r.nssfEmployer; t.shif+=r.shif;
    t.ahlE+=r.ahlEmployee; t.ahlEr+=r.ahlEmployer; t.nita+=r.nita; t.paye+=r.paye;
    t.otherD+=r.otherDeduct; t.net+=r.net; t.employerCost+=r.employerCost;
  });
  rows.push(['TOTAL', '', '', Math.round(t.gross), Math.round(t.nssfE), Math.round(t.nssfEr),
    Math.round(t.shif), Math.round(t.ahlE), Math.round(t.ahlEr), Math.round(t.nita),
    Math.round(t.paye), Math.round(t.otherD), Math.round(t.net), Math.round(t.employerCost)]);
  downloadCSV(rows, `${(c.name||'payroll').replace(/\s+/g,'_')}_payroll_register_${c.period||''}.csv`);
}

function exportPayrollRegisterPDF(){

  const left = 40; let y = 50;

  if(c.logoDataUrl){
    const logoW = Math.min(c.logoSize || 60, 90); // cap slightly smaller here so it doesn't crowd a landscape header
    const logoH = logoW * (c.logoAspect || 0.75);
    try{ doc.addImage(c.logoDataUrl, 'PNG', left, y - 30, logoW, logoH); }catch(e){}
  }
  const textLeft = c.logoDataUrl ? left + Math.min(c.logoSize || 60, 90) + 14 : left;
  doc.setFont('helvetica','bold'); doc.setFontSize(17);
  doc.setTextColor(br,bg,bb);
  doc.text(c.name || 'Payroll Register', textLeft, y);
  doc.setTextColor(20,20,20);
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text(`Pay period: ${c.period || 'Not set'}   |   Employer KRA PIN: ${c.kraPin || '-'}`, textLeft, y + 16);
  y += 40;

  const head = [[
    'Name','Basic','Allowances','Gross','NSSF (Emp)','NSSF (Er)','SHIF',
    'Housing (Emp)','Housing (Er)','NITA','PAYE','Other Ded.','Net Pay','Employer Cost'
  ]];
  const body = [];
  const totals = { basic:0, allowances:0, gross:0, nssfE:0, nssfEr:0, shif:0, ahlE:0, ahlEr:0, nita:0, paye:0, otherD:0, net:0, cost:0 };
  c.employees.forEach(e=>{
    const r = calcEmployee(e);
    body.push([
      e.name||'-', fmt(e.basic), fmt(e.allowances), fmt(r.gross), fmt(r.nssfEmployee), fmt(r.nssfEmployer),
      fmt(r.shif), fmt(r.ahlEmployee), fmt(r.ahlEmployer), fmt(r.nita), fmt(r.paye), fmt(r.otherDeduct), fmt(r.net), fmt(r.employerCost)
    ]);
    totals.basic+=e.basic||0; totals.allowances+=e.allowances||0; totals.gross+=r.gross;
    totals.nssfE+=r.nssfEmployee; totals.nssfEr+=r.nssfEmployer; totals.shif+=r.shif;
    totals.ahlE+=r.ahlEmployee; totals.ahlEr+=r.ahlEmployer; totals.nita+=r.nita;
    totals.paye+=r.paye; totals.otherD+=r.otherDeduct; totals.net+=r.net; totals.cost+=r.employerCost;
  });
  const footRow = [[
    'TOTAL', fmt(totals.basic), fmt(totals.allowances), fmt(totals.gross), fmt(totals.nssfE), fmt(totals.nssfEr),
    fmt(totals.shif), fmt(totals.ahlE), fmt(totals.ahlEr), fmt(totals.nita), fmt(totals.paye), fmt(totals.otherD), fmt(totals.net), fmt(totals.cost)
  ]];

  doc.autoTable({
    startY: y,
    head, body, foot: footRow,
    margin: { left: 40, right: 40 },
    styles: { fontSize: 7.5, cellPadding: 4 },
    headStyles: { fillColor: [br,bg,bb], textColor: [255,255,255], fontStyle:'bold' },
    footStyles: { fillColor: [235,235,235], textColor: [20,20,20], fontStyle:'bold' },
    columnStyles: { 0: { halign:'left' } },
    theme: 'grid'
  });

  const finalY = doc.lastAutoTable.finalY + 20;
  doc.setFont('helvetica','italic'); doc.setFontSize(8);
  doc.setTextColor(140,140,140);
  doc.text('Generated by Finlens Africa. Verify statutory figures against current KRA/NSSF/SHA rates.', left, finalY);

  doc.save(`${(c.name||'payroll').replace(/\s+/g,'_')}_payroll_register_${c.period||''}.pdf`);
}

async function emailAllPayslips(evt){
  const c = state.clients[state.activeClient];
  const targets = c.employees.filter(e => e.email);
  const skipped = c.employees.filter(e => !e.email);
  if(targets.length === 0){
    alert('No employees have an email address on file yet. Add emails under each employee\'s Statutory identifiers first.');
    return;
  }
  if(!confirm(`Send payslips to ${targets.length} employee(s) with an email on file?${skipped.length ? ` (${skipped.length} employee(s) will be skipped \u2014 no email on file.)` : ''}`)) return;

  const btn = evt.target;
  const originalText = btn.textContent;
  let sent = 0; const failed = [];

  for(const emp of targets){
    btn.textContent = `Sending... (${sent + failed.length + 1}/${targets.length})`;
    btn.disabled = true;
    try{
      const { doc } = generatePayslipPDF(emp.id);
      const pdfBase64 = doc.output('datauristring').split(',')[1];
      const { error } = await sb.functions.invoke('send-payslip', {
        body: { to: emp.email, employeeName: emp.name, companyName: c.name, period: c.period, pdfBase64 }
      });
      if(error) throw error;
      sent++;
    } catch(err){
      failed.push(emp.name || 'Unnamed');
    }
    await new Promise(r => setTimeout(r, 350)); // gentle pacing to avoid rate limits
  }

  btn.textContent = originalText; btn.disabled = false;
  let summary = `Sent ${sent} of ${targets.length} payslip(s).`;
  if(skipped.length) summary += ` ${skipped.length} skipped (no email on file).`;
  if(failed.length) summary += ` Failed: ${failed.join(', ')}.`;
  alert(summary);
}
